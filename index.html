<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE-MOVIE | PRO VERSION</title>
    <style>
        :root { --main: #00d2ff; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; }
        .nav { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--main); text-decoration: none; text-shadow: 0 0 10px var(--main); }
        .search-box { display: flex; gap: 10px; margin: 20px 5%; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; }
        button { padding: 10px 25px; background: var(--main); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 5%; }
        .card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { padding: 10px; font-size: 13px; text-align: center; margin: 0; font-weight: bold; }
        /* Player Overlay */
        .player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        iframe { width: 100%; flex: 1; border: none; }
        .eps { padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; background: #111; max-height: 200px; overflow-y: auto; }
        .ep { padding: 8px 15px; background: #222; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .ep.active { background: var(--main); color: #000; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="logo">BLUE-MOVIE</a>
        <div id="status" style="font-size: 12px; color: #666;">Proxy: Active</div>
    </nav>

    <div class="search-box">
        <input type="text" id="k" placeholder="Tìm tên phim hoặc phim bộ..." onkeypress="if(event.key==='Enter') search()">
        <button onclick="search()">TÌM KIẾM</button>
    </div>

    <div id="grid" class="grid"></div>

    <div id="player" class="player">
        <div style="padding: 15px; display: flex; justify-content: space-between;">
            <b id="m-name">...</b>
            <b onclick="closePlayer()" style="color:red; cursor:pointer;">[ĐÓNG X]</b>
        </div>
        <iframe id="vid" allowfullscreen></iframe>
        <div id="eps" class="eps"></div>
    </div>

    <script>
        const PROXY = "/api/proxy?path=";

        async function load(path) {
            const g = document.getElementById('grid');
            g.innerHTML = '<p style="grid-column: 1/-1; text-align:center">Đang tải phim qua Proxy Python...</p>';
            try {
                const res = await fetch(PROXY + encodeURIComponent(path));
                const data = await res.json();
                const items = data.data.items || [];
                
                g.innerHTML = items.map(m => `
                    <div class="card" onclick="view('${m.slug}')">
                        <img src="https://img.otruyenapi.com/uploads/movies/${m.thumb_url}">
                        <p class="card-t">${m.name}</p>
                    </div>
                `).join('');
            } catch (e) { g.innerHTML = '<p style="color:red">Lỗi Proxy! Hãy kiểm tra log trên Vercel.</p>'; }
        }

        async function search() {
            const k = document.getElementById('k').value;
            if(k) load('tim-kiem?keyword=' + encodeURIComponent(k));
        }

        async function view(slug) {
            try {
                const res = await fetch(PROXY + encodeURIComponent('phim/' + slug));
                const data = await res.json();
                const m = data.data.item;
                const sv = m.episodes[0].server_data;

                document.getElementById('player').style.display = 'flex';
                document.getElementById('m-name').innerText = m.name;
                document.getElementById('eps').innerHTML = sv.map((e, i) => `
                    <div class="ep ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</div>
                `).join('');
                play(sv[0].link_embed, document.querySelector('.ep'));
            } catch (e) { alert("Lỗi tải tập phim!"); }
        }

        function play(url, el) {
            document.getElementById('vid').src = url;
            document.querySelectorAll('.ep').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('vid').src = "";
        }

        window.onload = () => load('danh-sach/phim-moi-cap-nhat');
    </script>
</body>
</html>
