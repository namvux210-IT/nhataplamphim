<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE-MOVIE | FINAL FIX</title>
    <style>
        :root { --main: #00d2ff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; }
        .nav { background: #000; padding: 15px 5%; display: flex; justify-content: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .search-area { padding: 20px 5%; display: flex; gap: 10px; background: #0a0a0a; }
        #search-input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #333; background: #151515; color: #fff; outline: none; }
        .btn-search { background: var(--main); color: #000; border: none; padding: 0 30px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px 5%; }
        .card { background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { padding: 10px; font-size: 13px; text-align: center; margin: 0; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge { position: absolute; top: 5px; left: 5px; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: #000; }
        
        /* PLAYER OVERLAY - Fix lỗi chồng phim */
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .player-header { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        iframe { width: 100%; flex: 1; border: none; background: #000; }
        .ep-box { padding: 20px 5%; background: #0a0a0a; max-height: 200px; overflow-y: auto; border-top: 1px solid #222; }
        .ep-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .ep-btn { padding: 8px 15px; background: #1a1a1a; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid #333; }
        .ep-btn.active { background: var(--main); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="nav"><a href="/" style="text-decoration:none; color:var(--main); font-weight:900; font-size:24px;">BLUE-MOVIE</a></nav>
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Nhập tên phim để tìm ngay...">
        <button class="btn-search" onclick="doSearch()">TÌM PHIM</button>
    </div>
    <div id="grid" class="grid"></div>

    <div id="player" class="player-overlay">
        <div class="player-header">
            <b id="m-name" style="color:var(--main)">Đang tải...</b>
            <button onclick="closePlayer()" style="background:#ff4444; color:#fff; border:none; padding:6px 15px; border-radius:5px; cursor:pointer;">ĐÓNG [X]</button>
        </div>
        <iframe id="video-iframe" allowfullscreen></iframe>
        <div class="ep-box"><div id="eps" class="ep-list"></div></div>
    </div>

    <script>
        const PROXY = "/api/proxy?";
        const IMG_URL = "https://images.weserv.nl/?url=";

        async function loadMovies(keyword = '') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<p style="grid-column:1/-1;text-align:center">🔍 Đang tìm phim từ 2 nguồn...</p>';
            try {
                const query = `keyword=${encodeURIComponent(keyword)}`;
                const [rK, rN] = await Promise.all([
                    fetch(`${PROXY}src=kkphim&${query}`).then(r => r.json().catch(() => ({}))),
                    fetch(`${PROXY}src=nguonc&${query}`).then(r => r.json().catch(() => ({})))
                ]);

                const itemsK = (rK.data?.items || rK.items || []).map(i => ({...i, _s: 'kkphim'}));
                const itemsN = (rN.data || rN.items || []).map(i => ({...i, _s: 'nguonc'}));
                
                const all = [...itemsN, ...itemsK];
                grid.innerHTML = all.map(m => {
                    let thumb = m.poster_url || m.thumb_url;
                    if(thumb && !thumb.includes('http')) thumb = (m._s==='kkphim'?'https://phimimg.com/':'') + thumb;
                    return `
                        <div class="card" onclick="openMovie('${m.slug}', '${m._s}')">
                            <span class="badge" style="background:${m._s==='kkphim'?'#00d2ff':'#ffcc00'}">${m._s.toUpperCase()}</span>
                            <img src="${IMG_URL + encodeURIComponent(thumb)}" onerror="this.src='https://placehold.co/200x300?text=No+Image'">
                            <p class="card-t">${m.name}</p>
                        </div>`;
                }).join('');
            } catch (e) { grid.innerHTML = "Lỗi kết nối!"; }
        }

        async function openMovie(slug, src) {
            closePlayer(); // Xóa phim cũ trước khi nạp phim mới
            try {
                const res = await fetch(`${PROXY}path=${encodeURIComponent(slug)}&src=${src}`).then(r => r.json());
                
                // Theo tài liệu NguonC & KKPhim
                let movie = (src === 'kkphim') ? res.data.item : res.movie;
                let episodes = (src === 'kkphim') ? res.data.item.episodes : res.movie.episodes;

                if (!episodes || episodes.length === 0) throw new Error();

                document.getElementById('player').style.display = 'flex';
                document.getElementById('m-name').innerText = movie.name;
                
                // Quét server để tìm link thực tế
                const activeSv = episodes.find(s => (s.server_data || s.items)?.length > 0) || episodes[0];
                const list = activeSv.server_data || activeSv.items;
                
                const epDiv = document.getElementById('eps');
                epDiv.innerHTML = list.map((e, i) => `
                    <div class="ep-btn ${i === 0 ? 'active' : ''}" onclick="play('${e.link_embed || e.m3u8_url}', this)">Tập ${e.name}</div>
                `).join('');
                
                if(list[0]) play(list[0].link_embed || list[0].m3u8_url, epDiv.querySelector('.ep-btn'));
            } catch (e) { 
                alert("Lỗi: Phim này đang gặp sự cố link từ nguồn này!"); 
                closePlayer();
            }
        }

        function play(url, btn) {
            if(!url) return;
            document.getElementById('video-iframe').src = url;
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('video-iframe').src = "";
            document.getElementById('eps').innerHTML = "";
        }

        function doSearch() { loadMovies(document.getElementById('search-input').value); }
        window.onload = () => loadMovies();
    </script>
</body>
</html>
