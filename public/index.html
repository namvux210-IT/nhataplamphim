<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GOLD CINEMA - FIXED POSTER</title>
    <style>
        :root { --gold: #FFD700; --bg: #080808; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; border-bottom: 2px solid var(--gold); }
        .logo { color: var(--gold); font-size: 24px; font-weight: 900; cursor: pointer; outline: none; }
        .cat-bar { background: #111; padding: 10px 5%; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { padding: 8px 15px; background: #222; border-radius: 20px; cursor: pointer; outline: none; white-space: nowrap; font-size: 14px; }
        .cat-item.active, .cat-item:focus { background: var(--gold); color: #000; font-weight: bold; }

        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: #121212; border-radius: 8px; border: 2px solid #222; cursor: pointer; outline: none; overflow: hidden; transition: 0.3s; }
        .card:focus { border-color: var(--gold); transform: scale(1.05); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .card-name { padding: 10px; text-align: center; color: var(--gold); font-size: 12px; font-weight: bold; }

        /* Detail View */
        #detail-view { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 1000; padding: 40px 10%; overflow-y: auto; }
        .detail-flex { display: flex; gap: 30px; }
        .detail-poster { width: 280px; border: 2px solid var(--gold); border-radius: 10px; }
        .detail-info { flex: 1; }
        .btn-watch { background: var(--gold); color: #000; width: 100%; padding: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 20px 0; }
        .btn-watch:focus { transform: scale(1.02); box-shadow: 0 0 15px var(--gold); outline: none; }
        .ep-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .ep-btn { padding: 8px 15px; background: #222; border: 1px solid var(--gold); color: #fff; cursor: pointer; outline: none; }
        .ep-btn.active, .ep-btn:focus { background: var(--gold); color: #000; font-weight: bold; }
        iframe { width: 100%; height: 500px; border: 2px solid var(--gold); margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" tabindex="0" onclick="location.reload()">GOLD CINEMA</div>
    <input type="text" id="search" placeholder="Tìm phim..." style="background:#1a1a1a; border:1px solid var(--gold); color:#fff; padding:8px 15px; border-radius:20px; outline:none">
</div>

<div class="cat-bar" id="catBar">
    <div class="cat-item active" tabindex="0" onclick="loadMovies()">Trang Chủ</div>
</div>

<div class="container">
    <h3 id="title">Phim Mới Cập Nhật</h3>
    <div id="grid" class="grid"></div>
</div>

<div id="detail-view">
    <button onclick="closeModal()" style="float:right; background:red; color:#fff; border:none; padding:10px 20px; cursor:pointer">QUAY LẠI [BACK]</button>
    <div id="detail-content" class="detail-flex"></div>
</div>

<script>
    async function init() {
        const res = await fetch('/api/proxy?genres=all').then(r => r.json());
        const bar = document.getElementById('catBar');
        (res.data?.items || []).forEach(g => {
            const div = document.createElement('div');
            div.className = 'cat-item';
            div.tabIndex = 0;
            div.innerText = g.name;
            div.onclick = () => loadMovies('', g.slug, g.name);
            bar.appendChild(div);
        });
        loadMovies();
    }

    async function loadMovies(kw='', cat='', name='Phim Mới Cập Nhật') {
        document.getElementById('title').innerText = name;
        const grid = document.getElementById('grid');
        grid.innerHTML = 'Đang tải...';
        
        // Chỉ gửi đúng tham số cần thiết để tránh lỗi 404
        let query = '';
        if(kw) query = `keyword=${encodeURIComponent(kw)}`;
        else if(cat) query = `category=${cat}`;

        const res = await fetch(`/api/proxy?${query}`).then(r => r.json());
        const items = res.data?.items || [];
        grid.innerHTML = items.map(m => `
            <div class="card" tabindex="0" onclick="openDetail('${m.slug}')">
                <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=GOLD+CINEMA'">
                <div class="card-name">${m.name}</div>
            </div>
        `).join('');
    }

    window.openDetail = async function(slug) {
        const modal = document.getElementById('detail-view');
        const content = document.getElementById('detail-content');
        modal.style.display = 'block';
        content.innerHTML = '<h2>Đang chuẩn bị dữ liệu...</h2>';

        // Gọi chính xác tham số path
        const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
        const m = res.data.item;
        const eps = m.episodes[0]?.server_data || [];
        let selectedUrl = eps[0]?.link_embed || "";

        content.innerHTML = `
            <img class="detail-poster" src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=IMAGE+ERROR'">
            <div class="detail-info">
                <h1 style="color:var(--gold);margin:0">${m.name}</h1>
                <p style="color:#aaa">${m.year} • ${m.origin_name}</p>
                <div style="background:#111;padding:15px;border-radius:8px;margin:20px 0;line-height:1.6">${m.content || 'Nội dung đang cập nhật...'}</div>
                
                <button class="btn-watch" id="btnPlay" tabindex="0" onclick="document.getElementById('p').style.display='block'; document.getElementById('p').src='${selectedUrl}'">▶ BẮT ĐẦU XEM PHIM</button>

                <h3>Danh sách tập:</h3>
                <div class="ep-list">
                    ${eps.map((e, i) => `<button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="document.getElementById('p').src='${e.link_embed}'; document.getElementById('p').style.display='block';">${e.name}</button>`).join('')}
                </div>
                <iframe id="p" allowfullscreen></iframe>
            </div>
        `;
        document.getElementById('btnPlay').focus();
    }

    window.closeModal = () => {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('p').src = "";
    };

    document.getElementById('search').onkeypress = (e) => { if(e.key === 'Enter') loadMovies(e.target.value); };
    window.onload = init;
</script>
</body>
</html>
