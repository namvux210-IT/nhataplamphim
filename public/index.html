<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - FULL DETAILS</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 180px; }
        @media (max-width: 1024px) { :root { --card-w: 150px; } }
        @media (max-width: 600px) { :root { --card-w: 120px; } }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Header */
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-size: clamp(18px, 4vw, 26px); font-weight: 900; text-decoration: none; }
        .search-box { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: clamp(100px, 20vw, 200px); }

        /* Focus cho TV Remote */
        .card:focus, .btn-play-hero:focus, .ep-btn:focus, .search-box:focus {
            outline: none !important; border: 3px solid var(--gold) !important; transform: scale(1.05); z-index: 10;
        }

        /* Hero Slider */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: clamp(400px, 75vh, 850px); position: relative; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 80%); }
        
        /* Thông tin phim trên Slider */
        .hero-info { position: absolute; bottom: 12%; left: 5%; right: 5%; z-index: 10; max-width: 800px; }
        .hero-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .hero-meta span { background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(255,215,0,0.4); color: #fff; white-space: nowrap; }
        .hero-title { font-size: clamp(26px, 5vw, 50px); color: var(--gold); margin: 0; font-weight: 900; line-height: 1.2; }
        .hero-desc { font-size: clamp(14px, 2vw, 17px); color: #bbb; margin: 15px 0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .btn-play-hero { background: var(--gold); color: #000; border: none; padding: 14px 40px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }

        /* Row Phim */
        .row { padding: 30px 0 10px 5%; }
        .row-title { font-size: clamp(16px, 3vw, 22px); margin-bottom: 15px; font-weight: bold; color: var(--gold); text-transform: uppercase; }
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .list-wrap::-webkit-scrollbar { display: none; }
        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; border-radius: 10px; overflow: hidden; background: #111; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { font-size: 13px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal Thông tin */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.92); align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; max-width: 500px; width: 85%; padding: 30px; text-align: center; }
        #iMeta { text-align: left; background: #222; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 14px; line-height: 1.8; color: #ccc; }
        #iMeta b { color: var(--gold); }

        #player { background: #000; flex-direction: column; }
        iframe { flex: 1; border: none; }
        .eps { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #111; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="/" class="logo" onclick="location.reload()">GOLD CINEMA</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm phim..." tabindex="1">
</div>

<div id="hero" class="hero-slider"></div>

<div id="content"></div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:120px; border-radius:10px; margin-bottom:10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
        <h2 id="iTitle" style="color:var(--gold); margin:0; font-size: 24px;"></h2>
        <div id="iMeta"></div> <button class="btn-play-hero" id="btnStart" tabindex="0" onclick="startPhim()" style="width:100%">▶ XEM PHIM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:15px; cursor:pointer; color:#666; font-size: 12px; font-weight: bold;">[ QUAY LẠI ]</p>
    </div>
</div>

<div id="player">
    <div style="padding:15px; display:flex; justify-content:space-between; align-items:center; background:#111; border-bottom: 1px solid #222;">
        <b id="pTitle" style="color:var(--gold);"></b>
        <button onclick="closePlayer()" style="background:#ff4d4d; color:#fff; border:none; padding:8px 20px; border-radius:5px; font-weight:bold; cursor:pointer;">THOÁT</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let movieData = null;

    async function addRow(title, params = '', isSearch = false) {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap ${isSearch ? 'search-mode' : ''}">
                        ${items.map(m => `
                            <div class="card" tabindex="0" onclick="showIntro('${m.slug}')" onkeypress="if(event.key==='Enter') showIntro('${m.slug}')">
                                <img src="${m.poster_url}" loading="lazy">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) { console.error("Lỗi tải hàng:", title); }
    }

    async function init() {
        const res = await fetch('/api/proxy').then(r => r.json());
        const top5 = res.data.items.slice(0, 5);
        
        const heroDetails = await Promise.all(top5.map(async (m) => {
            const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
            return d.data.item;
        }));

        document.getElementById('hero').innerHTML = heroDetails.map(m => `
            <div class="hero-item">
                <img src="${m.thumb_url || m.poster_url}" class="hero-img">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <div class="hero-meta">
                        <span>📅 ${m.year}</span>
                        <span>🎞️ ${m.episode_current}</span>
                        <span>🌍 ${m.country[0]?.name || 'N/A'}</span>
                        <span>🎭 ${m.category[0]?.name || 'N/A'}</span>
                    </div>
                    <h1 class="hero-title">${m.name}</h1>
                    <div class="hero-desc">${m.content.replace(/<[^>]*>/g, '')}</div>
                    <button class="btn-play-hero" tabindex="0" onclick="showIntro('${m.slug}')">CHI TIẾT PHIM</button>
                </div>
            </div>
        `).join('');

        setInterval(() => {
            const h = document.getElementById('hero');
            if(h) {
                h.scrollLeft += h.offsetWidth;
                if (h.scrollLeft >= h.scrollWidth - h.offsetWidth) h.scrollLeft = 0;
            }
        }, 8000);

        await addRow('🔥 PHIM MỚI CẬP NHẬT TRONG NGÀY');
        await addRow('⚔️ HÀNH ĐỘNG GAY CẤN', 'cat=hanh-dong');
        await addRow('🐉 CỔ TRANG TRUNG QUỐC', 'nation=trung-quoc');
        await addRow('🎭 DRAMA HÀN QUỐC', 'nation=han-quoc');
    }

    window.showIntro = async (slug) => {
        try {
            const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
            movieData = r.data.item;
            document.getElementById('iTitle').innerText = movieData.name;
            document.getElementById('iImg').src = movieData.poster_url;
            
            // Hiển thị 4 thông số trong bảng chi tiết
            document.getElementById('iMeta').innerHTML = `
                • Quốc gia: <b>${movieData.country.map(c => c.name).join(', ')}</b><br>
                • Thể loại: <b>${movieData.category.map(c => c.name).join(', ')}</b><br>
                • Năm phát hành: <b>${movieData.year}</b><br>
                • Trạng thái: <b>${movieData.episode_current}</b>
            `;
            
            document.getElementById('intro').style.display = 'flex';
            document.getElementById('btnStart').focus();
        } catch(e) { alert('Không thể tải thông tin phim!'); }
    };

    window.startPhim = () => {
        const srv = movieData.episodes[0].server_data;
        document.getElementById('pTitle').innerText = movieData.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => document.getElementById('intro').style.display = 'none';
    window.closePlayer = () => { document.getElementById('player').style.display = 'none'; document.getElementById('video').src = ''; };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`🔍 KẾT QUẢ: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`, true);
        }
    };

    window.onload = init;
</script>
</body>
</html>
