<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMovie - Đa Nguồn Phim</title>
    <style>
        :root { --main: #00d2ff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .nav { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 100; gap: 10px; }
        .logo { color: var(--main); font-size: 22px; font-weight: 900; text-decoration: none; }
        
        /* Nút chọn nguồn */
        .source-selector { background: #1a1a1a; color: var(--main); border: 1px solid var(--main); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; outline: none; }
        
        .search-box { background: #151515; border-radius: 20px; padding: 8px 15px; flex: 1; max-width: 300px; display: flex; border: 1px solid #333; }
        .search-box input { background: none; border: none; color: #fff; width: 100%; outline: none; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 25px 5%; }
        .card { background: #111; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-name { padding: 10px; font-size: 13px; text-align: center; font-weight: bold; }

        /* Player Overlay */
        #overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; }
        .p-header { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: #111; }
        iframe { width: 100%; height: 65vh; border: none; background: #000; }
        .eps { padding: 20px 5%; display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; flex: 1; }
        .ep-btn { padding: 8px 15px; background: #222; border-radius: 5px; cursor: pointer; font-size: 12px; border: 1px solid #333; }
        .ep-btn.active { background: var(--main); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="logo">BossMovie</a>
    
    <select id="sourceSelect" class="source-selector" onchange="changeSource()">
        <option value="kkphim">NGUỒN KKPHIM</option>
        <option value="nguonc">NGUỒN NGUONC</option>
        <option value="ophim">NGUỒN OPHIM</option>
    </select>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm phim...">
    </div>
</nav>

<div id="grid" class="grid"></div>

<div id="overlay">
    <div class="p-header">
        <h3 id="mName" style="margin:0; color:var(--main);"></h3>
        <button onclick="closeP()" style="background:#ff4444; border:none; color:#fff; padding:8px 15px; border-radius:5px; cursor:pointer;">ĐÓNG</button>
    </div>
    <iframe id="pFrame" allowfullscreen></iframe>
    <div id="epList" class="eps"></div>
</div>

<script>
    let currentSource = 'kkphim';

    function changeSource() {
        currentSource = document.getElementById('sourceSelect').value;
        loadMovies(); // Tải lại phim mới của nguồn vừa chọn
    }

    async function loadMovies(keyword = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Đang tải từ ' + currentSource.toUpperCase() + '...</p>';
        
        try {
            const res = await fetch(`/api/${currentSource}?keyword=${encodeURIComponent(keyword)}`).then(r => r.json());
            const items = (currentSource === 'nguonc') ? res.items : (res.data?.items || res.items || []);
            
            grid.innerHTML = items.map(m => `
                <div class="card" onclick="openMovie('${m.slug}')">
                    <img src="${m.poster_url.includes('http') ? m.poster_url : 'https://phimimg.com/' + m.poster_url}" onerror="this.src='https://placehold.co/200x300'">
                    <div class="card-name">${m.name}</div>
                </div>
            `).join('');
        } catch (e) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Lỗi kết nối proxy ' + currentSource + '</p>';
        }
    }

    async function openMovie(slug) {
        document.getElementById('overlay').style.display = 'flex';
        const epDiv = document.getElementById('epList');
        const iframe = document.getElementById('pFrame');
        epDiv.innerHTML = 'Đang lấy link...';
        iframe.src = "";

        try {
            const res = await fetch(`/api/${currentSource}?path=${slug}`).then(r => r.json());
            
            // Logic bóc tách theo nguồn
            let movie = (currentSource === 'nguonc') ? res.movie : (res.data?.item || res.movie);
            let episodes = movie.episodes || [];
            
            document.getElementById('mName').innerText = movie.name;
            
            const server = episodes.find(sv => (sv.server_data || sv.items || []).length > 0) || episodes[0];
            const list = server.server_data || server.items || [];
            
            epDiv.innerHTML = list.map((e, i) => `
                <div class="ep-btn ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</div>
            `).join('');
            
            if(list[0]) play(list[0].link_embed, epDiv.querySelector('.ep-btn'));
        } catch (e) {
            epDiv.innerHTML = '<p style="color:red">Lỗi bóc tách link!</p>';
        }
    }

    function play(url, btn) {
        document.getElementById('pFrame').src = url;
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
    }

    function closeP() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('pFrame').src = ""; // Dừng phim để tránh lag
    }

    document.getElementById('searchInput').onkeypress = (e) => { if(e.key==='Enter') loadMovies(e.target.value); };
    window.onload = () => loadMovies();
</script>
</body>
</html>
