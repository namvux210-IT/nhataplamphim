<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMovie - Đẳng Cấp Phim</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root { --primary: #ffb400; --bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #000; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; }
        
        /* Search */
        .search-group { display: flex; background: #222; border-radius: 20px; padding: 5px 15px; width: 40%; }
        .search-group input { background: none; border: none; color: #fff; width: 100%; outline: none; padding: 5px; }
        
        /* Movie Grid */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; transition: 0.3s; cursor: pointer; position: relative; border: 2px solid transparent; }
        .movie-card:focus, .movie-card:hover { border-color: var(--primary); transform: scale(1.05); outline: none; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-card .info { padding: 10px; font-size: 13px; font-weight: bold; text-align: center; }
        .source-tag { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        /* Player Overlay */
        #player-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .vjs-player { width: 100%; flex: 1; }
        .episodes { padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; background: #111; max-height: 150px; overflow-y: auto; }
        .ep-btn { padding: 8px 15px; background: #333; border-radius: 4px; cursor: pointer; }
        .ep-btn.active { background: var(--primary); color: #000; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">BOSSMOVIE</a>
    <div class="search-group">
        <input type="text" id="search" placeholder="Tìm kiếm phim, năm, thể loại...">
    </div>
</nav>

<div class="container">
    <h2 id="title">Phim Mới Cập Nhật</h2>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div style="padding: 10px 5%; display: flex; justify-content: space-between;">
        <h3 id="playing-title"></h3>
        <button onclick="closePlayer()" style="background:var(--primary); border:none; padding:5px 20px; cursor:pointer; font-weight:bold;">THOÁT</button>
    </div>
    <video id="boss-player" class="video-js vjs-big-play-centered"></video>
    <div id="eps" class="episodes"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const API = "/api/movies";
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    let player = videojs('boss-player', { controls: true, fluid: true, playbackRates: [0.5, 1, 1.5, 2] });

    // 1. Hàm load phim
    async function loadMovies(keyword = '') {
        grid.innerHTML = '<p>Đang tải phim...</p>';
        const url = keyword ? `${API}?keyword=${encodeURIComponent(keyword)}` : API;
        const res = await fetch(url).then(r => r.json());
        
        grid.innerHTML = res.map(m => `
            <div class="movie-card" tabindex="0" onclick="openMovie('${m.slug}', '${m._source}')">
                <span class="source-tag">${m._source.toUpperCase()}</span>
                <img src="${m.poster_url.includes('http') ? m.poster_url : 'https://phimimg.com/' + m.poster_url}" alt="${m.name}">
                <div class="info">${m.name}</div>
            </div>
        `).join('');
    }

    // 2. Hàm mở phim
    async function openMovie(slug, src) {
        const res = await fetch(`${API}?path=${slug}&src=${src}`).then(r => r.json());
        const movie = src === 'nguonc' ? res.movie : res.data.item;
        const episodes = src === 'nguonc' ? res.movie.episodes : res.data.item.episodes;

        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('playing-title').innerText = movie.name;

        // Lấy danh sách tập của server đầu tiên
        const server = episodes[0];
        const list = server.server_data || server.items;

        const epHtml = list.map((e, i) => `
            <div class="ep-btn" onclick="playVideo('${e.link_embed || e.m3u8_url}', this)">Tập ${e.name}</div>
        `).join('');
        document.getElementById('eps').innerHTML = epHtml;

        if(list[0]) playVideo(list[0].link_embed || list[0].m3u8_url, document.querySelector('.ep-btn'));
    }

    function playVideo(url, el) {
        player.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
        player.play();
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function closePlayer() {
        player.pause();
        document.getElementById('player-overlay').style.display = 'none';
    }

    // 3. Xử lý tìm kiếm (Debounce)
    let timeout = null;
    searchInput.oninput = () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => loadMovies(searchInput.value), 500);
    };

    window.onload = () => loadMovies();
</script>
</body>
</html>
