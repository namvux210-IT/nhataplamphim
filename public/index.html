<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD CINEMA</title>
    <style>
        :root { --gold: #FFD700; --bg: #050505; --card-bg: #111; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Header tối giản */
        .header { background: rgba(0,0,0,0.9); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 800; color: var(--gold); cursor: pointer; letter-spacing: 1px; }
        .search { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 6px 12px; color: #fff; width: 160px; outline: none; transition: 0.3s; }
        .search:focus { border-color: var(--gold); width: 220px; }

        /* Movie Grid */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; } }

        .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.2s; position: relative; }
        .card:hover, .card:focus { transform: scale(1.05); border-color: var(--gold); outline: none; z-index: 10; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-name { padding: 8px; font-size: 12px; text-align: center; font-weight: 600; background: #111; color: #ddd; }

        /* Giao diện xem phim tối giản */
        #watch-view { position: fixed; inset: 0; background: var(--bg); display: none; z-index: 1000; overflow-y: auto; }
        .watch-header { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .watch-content { padding: 20px 5%; max-width: 1200px; margin: 0 auto; }
        
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        .movie-info { margin-top: 20px; }
        .movie-title { font-size: 22px; color: var(--gold); margin: 0; }
        .movie-meta { font-size: 13px; color: #888; margin-top: 5px; }
        
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; margin-top: 20px; }
        .ep-btn { padding: 8px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .ep-btn.active, .ep-btn:focus { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; outline: none; }

        .close-btn { background: #333; border: none; color: #fff; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .close-btn:hover { background: red; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.reload()">GOLD CINEMA</div>
    <input type="text" class="search" id="searchInp" placeholder="Tìm phim...">
</div>

<div class="container">
    <div id="movieGrid" class="grid"></div>
</div>

<div id="watch-view">
    <div class="watch-header">
        <span id="headerName" style="font-weight: bold; color: var(--gold);">ĐANG XEM</span>
        <button class="close-btn" onclick="closeWatch()">ĐÓNG X</button>
    </div>
    <div class="watch-content">
        <div class="player-box">
            <iframe id="ifr" allowfullscreen></iframe>
        </div>
        <div class="movie-info">
            <h1 id="mTitle" class="movie-title">Tên Phim</h1>
            <div id="mMeta" class="movie-meta">Năm • Quốc gia</div>
            <div id="epList" class="ep-grid"></div>
        </div>
    </div>
</div>

<script>
    async function loadGrid(kw = '') {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '<p style="text-align:center;width:100%">Đang tải...</p>';
        const url = kw ? `/api/proxy?keyword=${encodeURIComponent(kw)}` : `/api/proxy`;
        
        try {
            const res = await fetch(url).then(r => r.json());
            const items = res.data?.items || [];
            grid.innerHTML = items.map(m => `
                <div class="card" tabindex="0" onclick="watchMovie('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/444?text=GOLD+CINEMA'">
                    <div class="card-name">${m.name}</div>
                </div>
            `).join('');
        } catch(e) { grid.innerHTML = 'Lỗi kết nối máy chủ.'; }
    }

    window.watchMovie = async function(slug) {
        const view = document.getElementById('watch-view');
        view.style.display = 'block';
        document.body.style.overflow = 'hidden';
        
        try {
            const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
            const m = res.data.item;
            const eps = m.episodes[0]?.server_data || [];
            
            document.getElementById('mTitle').innerText = m.name;
            document.getElementById('mMeta').innerText = `${m.year} • ${m.origin_name} • ${m.time}`;
            document.getElementById('ifr').src = eps[0]?.link_embed || "";
            
            const epContainer = document.getElementById('epList');
            epContainer.innerHTML = eps.map((e, i) => `
                <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="setEp('${e.link_embed}', this)">${e.name}</button>
            `).join('');
        } catch(e) { alert('Lỗi tải phim!'); }
    };

    window.setEp = (url, btn) => {
        document.getElementById('ifr').src = url;
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.closeWatch = () => {
        document.getElementById('watch-view').style.display = 'none';
        document.getElementById('ifr').src = "";
        document.body.style.overflow = 'auto';
    };

    document.getElementById('searchInp').onkeypress = (e) => { 
        if(e.key === 'Enter') loadGrid(e.target.value); 
    };

    window.onload = () => loadGrid();
</script>
</body>
</html>
