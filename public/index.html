<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - MODERN UI</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 180px; }
        @media (max-width: 1024px) { :root { --card-w: 150px; } }
        @media (max-width: 600px) { :root { --card-w: 120px; } }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Nav */
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-size: clamp(18px, 4vw, 24px); font-weight: 900; text-decoration: none; cursor: pointer; }
        .search-box { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: clamp(100px, 20vw, 200px); }

        /* Focus cho TV/PC */
        .card:focus, .btn-hero:focus, .ep-btn:focus, .search-box:focus {
            outline: none !important; border: 3px solid var(--gold) !important; transform: scale(1.05);
        }

        /* Hero Slider */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 75vh; min-height: 450px; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 15%, transparent 80%); }
        .hero-info { position: absolute; bottom: 10%; left: 5%; right: 5%; z-index: 10; max-width: 800px; }
        .hero-title { font-size: clamp(28px, 6vw, 55px); color: var(--gold); margin: 0; font-weight: 900; }
        .hero-meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; font-size: 14px; font-weight: bold; }
        .hero-meta span { background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(255,215,0,0.3); }
        .hero-desc { font-size: 15px; color: #ccc; margin-bottom: 25px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-hero { background: var(--gold); color: #000; border: none; padding: 15px 40px; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; }

        /* Home Content Rows */
        .row { padding: 30px 0 10px 5%; }
        .row-title { font-size: clamp(18px, 3vw, 24px); margin-bottom: 15px; font-weight: bold; color: var(--gold); text-transform: uppercase; }
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .list-wrap::-webkit-scrollbar { display: none; }
        .list-wrap.grid-mode { flex-wrap: wrap; overflow-x: hidden; }

        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; border-radius: 10px; overflow: hidden; background: #111; border: 2px solid transparent; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { font-size: 13px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modals */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; max-width: 480px; width: 85%; padding: 35px; text-align: center; }
        #iMetaBox { text-align: left; background: #111; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 14px; line-height: 1.8; color: #bbb; border-left: 4px solid var(--gold); }
        
        #player { background: #000; flex-direction: column; }
        .p-head { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        iframe { flex: 1; border: none; background: #000; }
        .eps { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #0b0b0b; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }
    </style>
</head>
<body>

<div class="nav">
    <a href="/" class="logo" onclick="location.reload()">GOLD CINEMA</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm phim..." tabindex="1">
</div>

<div id="hero" class="hero-slider"></div>

<div id="content"></div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:130px; border-radius:10px; margin-bottom:15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);">
        <h2 id="iTitle" style="color:var(--gold); margin:0; font-size: 26px;"></h2>
        <div id="iMetaBox"></div>
        <button class="btn-hero" id="btnStart" tabindex="0" onclick="startPhim()" style="width:100%">▶ XEM PHIM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:20px; cursor:pointer; color:#666; font-weight:bold; font-size:13px;">[ QUAY LẠI ]</p>
    </div>
</div>

<div id="player">
    <div class="p-head">
        <b id="pTitle" style="color:var(--gold); font-size: 16px;"></b>
        <button onclick="closePlayer()" style="background:#ff4d4d; color:#fff; border:none; padding:8px 25px; border-radius:6px; font-weight:bold; cursor:pointer;">THOÁT [X]</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let activeMovie = null;

    // Hàm gọi API hàng phim
    async function addRow(title, params = '', isSearch = false) {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap ${isSearch ? 'grid-mode' : ''}">
                        ${items.map(m => `
                            <div class="card" tabindex="0" onclick="showIntro('${m.slug}')" onkeypress="if(event.key==='Enter') showIntro('${m.slug}')">
                                <img src="${m.poster_url}" loading="lazy" onerror="this.src='https://placehold.co/300x450/111/333?text=PHIM'">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) { console.error("Lỗi:", title); }
    }

    // Khởi tạo trang chủ
    async function init() {
        try {
            // Lấy phim đề xuất cho Hero Slider
            const res = await fetch('/api/proxy').then(r => r.json());
            const top5 = res.data.items.slice(0, 5);
            
            const heroHtml = await Promise.all(top5.map(async (m) => {
                const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
                const detail = d.data.item;
                return `
                    <div class="hero-item">
                        <img src="${detail.thumb_url || detail.poster_url}" class="hero-img">
                        <div class="hero-overlay"></div>
                        <div class="hero-info">
                            <div class="hero-meta">
                                <span>📅 ${detail.year}</span>
                                <span>🌍 ${detail.country[0]?.name || 'N/A'}</span>
                                <span>🎞️ ${detail.episode_current}</span>
                                <span>🎭 ${detail.category[0]?.name || 'N/A'}</span>
                            </div>
                            <h1 class="hero-title">${detail.name}</h1>
                            <div class="hero-desc">${detail.content.replace(/<[^>]*>/g, '')}</div>
                            <button class="btn-hero" tabindex="0" onclick="showIntro('${detail.slug}')">▶ XEM CHI TIẾT</button>
                        </div>
                    </div>
                `;
            }));
            document.getElementById('hero').innerHTML = heroHtml.join('');

            // Tự động trượt slider
            setInterval(() => {
                const h = document.getElementById('hero');
                if(h.scrollLeft >= h.scrollWidth - h.offsetWidth) h.scrollLeft = 0;
                else h.scrollLeft += h.offsetWidth;
            }, 8000);

            // Load các hàng phim theo yêu cầu
            await addRow('🔥 PHIM MỚI CẬP NHẬT TRONG NGÀY');
            await addRow('⚔️ PHIM HÀNH ĐỘNG GAY CẤN', 'cat=hanh-dong');
            await addRow('💖 PHIM TÌNH CẢM ĐẶC SẮC', 'cat=tinh-cam');
            await addRow('🐉 PHIM CỔ TRANG TRUNG QUỐC', 'nation=trung-quoc');
            await addRow('🎭 PHIM TRUYỀN HÌNH HÀN QUỐC', 'nation=han-quoc');
            await addRow('🧟 PHIM KINH DỊ', 'cat=kinh-di');
        } catch(e) { console.error("Lỗi khởi tạo"); }
    }

    // Modal Giới thiệu
    window.showIntro = async (slug) => {
        const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
        activeMovie = r.data.item;
        document.getElementById('iTitle').innerText = activeMovie.name;
        document.getElementById('iImg').src = activeMovie.poster_url;
        document.getElementById('iMetaBox').innerHTML = `
            • Quốc gia: <b>${activeMovie.country.map(c => c.name).join(', ')}</b><br>
            • Thể loại: <b>${activeMovie.category.map(c => c.name).join(', ')}</b><br>
            • Năm sản xuất: <b>${activeMovie.year}</b><br>
            • Trạng thái: <b>${activeMovie.episode_current}</b>
        `;
        document.getElementById('intro').style.display = 'flex';
        document.getElementById('btnStart').focus();
    };

    // Chế độ phát phim
    window.startPhim = () => {
        const srv = activeMovie.episodes[0].server_data;
        document.getElementById('pTitle').innerText = activeMovie.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => document.getElementById('intro').style.display = 'none';
    window.closePlayer = () => {
        document.getElementById('player').style.display = 'none';
        document.getElementById('video').src = '';
    };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`🔍 KẾT QUẢ CHO: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`, true);
        }
    };

    window.onload = init;
</script>
</body>
</html>
