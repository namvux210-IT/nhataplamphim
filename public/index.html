<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - V3</title>
    <style>
        :root { --gold: #FFD700; --bg: #080808; --card: #151515; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        
        /* Header */
        .header { background: #000; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--gold); font-size: 20px; font-weight: 900; cursor: pointer; }
        input { background: #1a1a1a; border: 1px solid var(--gold); color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: 150px; transition: 0.3s; }
        input:focus { width: 200px; }

        /* Phim Grid */
        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; } }
        
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid #222; cursor: pointer; outline: none; transition: 0.3s; }
        .card:focus, .card:hover { border-color: var(--gold); transform: scale(1.05); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-name { padding: 8px; text-align: center; font-size: 12px; font-weight: bold; color: var(--gold); }

        /* Modal Thông tin phim (Responsive) */
        #detail-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 1000; overflow-y: auto; }
        .modal-body { padding: 20px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .modal-body { flex-direction: row; padding: 60px 20px; } }

        .m-poster { width: 100%; max-width: 300px; border-radius: 10px; border: 2px solid var(--gold); align-self: center; }
        .m-info { flex: 1; }
        .btn-watch { background: var(--gold); color: #000; width: 100%; padding: 16px; border: none; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 20px 0; }
        .btn-watch:focus { background: #fff; box-shadow: 0 0 20px var(--gold); }

        .ep-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .ep-item { padding: 10px 18px; background: #222; border: 1px solid var(--gold); color: #fff; border-radius: 5px; cursor: pointer; outline: none; }
        .ep-item.active, .ep-item:focus { background: var(--gold); color: #000; font-weight: bold; }

        #player-box { display: none; margin-top: 20px; aspect-ratio: 16/9; width: 100%; }
        iframe { width: 100%; height: 100%; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.reload()">GOLD CINEMA</div>
    <input type="text" id="search" placeholder="Tìm phim...">
</div>

<div class="container">
    <h3 id="title" style="color:var(--gold)">Phim Mới Cập Nhật</h3>
    <div id="grid" class="grid"></div>
</div>

<div id="detail-modal">
    <button onclick="closeModal()" style="position:fixed; top:10px; right:10px; background:red; color:#fff; border:none; padding:10px 20px; cursor:pointer; font-weight:bold; z-index:1001">ĐÓNG [X]</button>
    <div id="modalContent" class="modal-body"></div>
</div>

<script>
    let currentLink = "";

    async function loadMovies(kw = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = 'Đang tải...';
        const url = kw ? `/api/proxy?keyword=${encodeURIComponent(kw)}` : `/api/proxy`;
        try {
            const res = await fetch(url).then(r => r.json());
            const items = res.data?.items || [];
            grid.innerHTML = items.map(m => `
                <div class="card" tabindex="0" onclick="openDetail('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=GOLD+CINEMA'">
                    <div class="card-name">${m.name}</div>
                </div>
            `).join('');
        } catch(e) { grid.innerHTML = 'Lỗi kết nối!'; }
    }

    window.openDetail = async function(slug) {
        const modal = document.getElementById('detail-modal');
        const content = document.getElementById('modalContent');
        modal.style.display = 'block';
        content.innerHTML = '<h3 style="width:100%;text-align:center">Đang tải phim...</h3>';

        try {
            const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
            const m = res.data.item;
            const eps = m.episodes[0]?.server_data || [];
            currentLink = eps[0]?.link_embed || "";

            content.innerHTML = `
                <img class="m-poster" src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=POSTER+ERROR'">
                <div class="m-info">
                    <h1 style="color:var(--gold);margin-top:0">${m.name}</h1>
                    <p style="color:#aaa">${m.year} • ${m.origin_name} • ${m.time}</p>
                    <div style="background:#111;padding:15px;border-radius:10px;line-height:1.6;font-size:14px">
                        ${m.content || 'Nội dung đang cập nhật...'}
                    </div>
                    
                    <button class="btn-watch" id="btnMainPlay" tabindex="0" onclick="startPlay()">▶ BẮT ĐẦU XEM PHIM</button>

                    <h4 style="color:var(--gold)">Chọn Tập:</h4>
                    <div class="ep-list">
                        ${eps.map((e, i) => `<button class="ep-item ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>`).join('')}
                    </div>
                    <div id="player-box"><iframe id="ifr" allowfullscreen></iframe></div>
                </div>
            `;
            document.getElementById('btnMainPlay').focus();
        } catch(e) { content.innerHTML = 'Lỗi dữ liệu!'; }
    }

    window.startPlay = () => {
        document.getElementById('player-box').style.display = 'block';
        document.getElementById('ifr').src = currentLink;
        document.getElementById('player-box').scrollIntoView({behavior: 'smooth'});
    };

    window.changeEp = (url, btn) => {
        currentLink = url;
        document.querySelectorAll('.ep-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(document.getElementById('player-box').style.display === 'block') startPlay();
    };

    window.closeModal = () => {
        document.getElementById('detail-modal').style.display = 'none';
        document.getElementById('ifr').src = "";
    };

    document.getElementById('search').onkeypress = (e) => { if(e.key === 'Enter') loadMovies(e.target.value); };
    window.onload = () => loadMovies();
</script>
</body>
</html>
