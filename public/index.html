<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE-MOVIE | DUAL-ENGINE-MIX</title>
    <style>
        :root { --main: #00d2ff; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; }
        .nav { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--main); text-decoration: none; text-shadow: 0 0 10px var(--main); }
        .search-box { display: flex; gap: 10px; margin: 20px 5%; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; border: 1px solid var(--main); }
        button { padding: 10px 25px; background: var(--main); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 5% 30px; }
        .card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-8px); border-color: var(--main); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
        .card-t { padding: 10px; font-size: 13px; text-align: center; margin: 0; font-weight: bold; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .badge { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; z-index: 10; color: #fff; }
        .more-btn { display: block; margin: 20px auto 50px; padding: 12px 40px; background: transparent; color: var(--main); border: 2px solid var(--main); border-radius: 30px; cursor: pointer; font-weight: bold; }
        .player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        iframe { width: 100%; flex: 1; border: none; }
        .eps { padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; background: #111; max-height: 200px; overflow-y: auto; }
        .ep { padding: 8px 15px; background: #222; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .ep.active { background: var(--main); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="logo">BLUE-MOVIE</a>
        <div style="font-size: 11px; color: #00ff00;">● OPhim (Red) + KKPhim (Blue)</div>
    </nav>

    <div class="search-box">
        <input type="text" id="k" placeholder="Tìm tên phim..." onkeypress="if(event.key==='Enter') search()">
        <button onclick="search()">TÌM KIẾM</button>
    </div>

    <div id="grid" class="grid"></div>
    <button id="more" class="more-btn" onclick="loadMore()">TẢI THÊM PHIM</button>

    <div id="player" class="player">
        <div style="padding: 15px; display: flex; justify-content: space-between; align-items:center; background: #000; border-bottom: 1px solid #222;">
            <b id="m-name" style="color:var(--main)">Đang tải...</b>
            <b onclick="closePlayer()" style="color:#ff4444; cursor:pointer;">[ĐÓNG X]</b>
        </div>
        <iframe id="vid" allowfullscreen></iframe>
        <div id="eps" class="eps"></div>
    </div>

    <script>
        const PROXY = "/api/proxy?path=";
        const IMG_PROXY = "https://images.weserv.nl/?url=";
        let currentPage = 1;
        let currentPath = 'danh-sach/phim-moi-cap-nhat';

        async function load(path, page = 1, append = false) {
            const g = document.getElementById('grid');
            if (!append) g.innerHTML = '<p style="grid-column: 1/-1; text-align:center">🔍 Đang trộn dữ liệu từ 2 nguồn...</p>';
            
            try {
                // Gọi cả 2 API cùng lúc
                const [resO, resK] = await Promise.all([
                    fetch(`${PROXY}${encodeURIComponent(path)}&src=ophim&page=${page}`).then(r => r.json().catch(() => ({items: []}))),
                    fetch(`${PROXY}${encodeURIComponent(path)}&src=kkphim&page=${page}`).then(r => r.json().catch(() => ({items: []})))
                ]);

                // Chuẩn hóa dữ liệu OPhim
                const itemsO = (resO.items || (resO.data && resO.data.items) || []).map(i => ({...i, _src: 'ophim'}));
                // Chuẩn hóa dữ liệu KKPhim
                const itemsK = (resK.items || (resK.data && resK.data.items) || []).map(i => ({...i, _src: 'kkphim'}));

                // Trộn xen kẽ phim: 1 OPhim - 1 KKPhim
                let combined = [];
                const maxLen = Math.max(itemsO.length, itemsK.length);
                for(let i = 0; i < maxLen; i++) {
                    if(itemsO[i]) combined.push(itemsO[i]);
                    if(itemsK[i]) combined.push(itemsK[i]);
                }

                if (!append) g.innerHTML = "";
                
                g.innerHTML += combined.map(m => {
                    const imgBase = (m._src === 'ophim') ? "https://img.otruyenapi.com/uploads/movies/" : "https://phimimg.com/";
                    const thumb = m.thumb_url.includes('http') ? m.thumb_url : imgBase + m.thumb_url;
                    const badgeColor = (m._src === 'ophim') ? "#ff3e3e" : "#00d2ff";
                    
                    return `
                        <div class="card" onclick="view('${m.slug}', '${m._src}')">
                            <span class="badge" style="background:${badgeColor}">${m._src.toUpperCase()}</span>
                            <img src="${IMG_PROXY + encodeURIComponent(thumb)}" loading="lazy" onerror="this.src='https://placehold.co/200x300?text=No+Poster'">
                            <p class="card-t">${m.name}</p>
                        </div>
                    `;
                }).join('');

                if (combined.length === 0 && !append) {
                    g.innerHTML = '<p style="grid-column: 1/-1; text-align:center">Không tìm thấy phim nào.</p>';
                }

            } catch (e) { console.error(e); }
        }

        async function search() {
            const val = document.getElementById('k').value;
            if (val) {
                currentPage = 1;
                // Xử lý slug cho tìm kiếm
                const k = val.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/đ/g, 'd').replace(/\s+/g, '-');
                currentPath = 'tim-kiem?keyword=' + encodeURIComponent(k);
                load(currentPath, 1, false);
            }
        }

        async function loadMore() {
            currentPage++;
            load(currentPath, currentPage, true);
        }

        async function view(slug, src) {
            try {
                const res = await fetch(`${PROXY}${encodeURIComponent('phim/' + slug)}&src=${src}`);
                const data = await res.json();
                const movie = data.movie || (data.data && data.data.item);
                const episodes = data.episodes || (data.data && data.data.item.episodes);
                
                document.getElementById('player').style.display = 'flex';
                document.getElementById('m-name').innerText = `[${src.toUpperCase()}] ${movie.name}`;
                
                const sv = episodes[0].server_data;
                const epDiv = document.getElementById('eps');
                epDiv.innerHTML = sv.map((e, i) => `
                    <div class="ep ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</div>
                `).join('');
                play(sv[0].link_embed, epDiv.querySelector('.ep'));
            } catch (e) { alert("Lỗi tải phim!"); }
        }

        function play(url, el) {
            document.getElementById('vid').src = url;
            document.querySelectorAll('.ep').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('vid').src = "";
        }

        window.onload = () => load(currentPath, 1);
    </script>
</body>
</html>
