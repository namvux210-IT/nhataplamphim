<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - OPHIM PREMIUM</title>
    <style>
        :root { --gold: #FFD700; --dark: #0A0A0A; --card-bg: #1A1A1A; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Navbar & Search */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .search-box { background: #222; border: 1px solid #444; border-radius: 30px; padding: 8px 20px; display: flex; align-items: center; width: 40%; transition: 0.3s; }
        .search-box:focus-within { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .search-box input { background: none; border: none; color: #fff; width: 100%; outline: none; font-size: 16px; }

        /* Movie Grid */
        .container { padding: 30px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: 0.4s; border: 1px solid #333; position: relative; }
        .card:hover, .card:focus { transform: scale(1.08); border-color: var(--gold); outline: none; z-index: 10; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-meta { padding: 12px; text-align: center; background: linear-gradient(to top, #000, transparent); }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* TV & Overlay */
        #player-overlay { position: fixed; inset: 0; background: var(--dark); display: none; flex-direction: column; z-index: 1000; }
        .player-header { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        iframe { width: 100%; height: 70vh; border: none; box-shadow: 0 0 50px rgba(255,215,0,0.1); }
        .episodes { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; overflow-y: auto; }
        .btn-ep { padding: 12px 20px; background: #222; border: 1px solid var(--gold); color: #fff; border-radius: 8px; cursor: pointer; min-width: 80px; }
        .btn-ep.active { background: var(--gold); color: #000; font-weight: bold; }
        .close-btn { background: var(--gold); border: none; padding: 10px 25px; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* Responsive TV */
        @media screen and (max-width: 1080px) { .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">GoldCinema</div>
    <div class="search-box">
        <input type="text" id="searchInp" placeholder="Tìm phim (không dấu cũng được)...">
    </div>
</div>

<div class="container">
    <h2 id="categoryTitle" style="color: var(--gold);">Phim Mới Cập Nhật</h2>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-header">
        <h2 id="mTitle" style="margin:0; color:var(--gold)"></h2>
        <button class="close-btn" onclick="closePlayer()">THOÁT [BACK]</button>
    </div>
    <iframe id="mainPlayer" allowfullscreen></iframe>
    <div class="episodes" id="epList"></div>
</div>

<script>
    // Xử lý tìm kiếm không dấu thông minh
    function removeVietnameseTones(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
    }

    async function fetchData(kw = '', path = '') {
        const url = `/api/proxy?keyword=${encodeURIComponent(kw)}&path=${path}`;
        return await fetch(url).then(r => r.json());
    }

    async function loadMovies(kw = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<p style="text-align:center; width:100%">Đang tải kho phim...</p>';
        
        try {
            const res = await fetchData(kw);
            const items = res.data?.items || [];
            
            if (items.length === 0) {
                grid.innerHTML = '<p>Không tìm thấy kết quả phù hợp.</p>';
                return;
            }

            grid.innerHTML = items.map(m => `
                <div class="card" tabindex="0" onclick="openMovie('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/1A1A1A/FFD700?text=No+Poster'">
                    <div class="card-meta">
                        <div class="card-title">${m.name}</div>
                        <small style="color:var(--gold)">${m.year || '2024'}</small>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            grid.innerHTML = 'Lỗi kết nối máy chủ.';
        }
    }

    window.openMovie = async function(slug) {
        const overlay = document.getElementById('player-overlay');
        overlay.style.display = 'flex';
        document.getElementById('epList').innerHTML = 'Đang trích xuất link...';

        try {
            const res = await fetchData('', slug);
            const movie = res.data.item;
            document.getElementById('mTitle').innerText = movie.name;

            const episodes = movie.episodes[0]?.server_data || [];
            document.getElementById('epList').innerHTML = episodes.map((e, i) => `
                <button class="btn-ep ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</button>
            `).join('');

            if(episodes[0]) play(episodes[0].link_embed, document.querySelector('.btn-ep'));
        } catch (e) {
            alert('Lỗi bóc tách link phim!');
        }
    }

    window.play = (url, btn) => {
        document.getElementById('mainPlayer').src = url;
        document.querySelectorAll('.btn-ep').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    window.closePlayer = () => {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('mainPlayer').src = "";
    }

    // Xử lý tìm kiếm khi gõ
    document.getElementById('searchInp').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            const query = removeVietnameseTones(e.target.value);
            loadMovies(query);
            document.getElementById('categoryTitle').innerText = `Kết quả tìm kiếm: ${e.target.value}`;
        }
    });

    window.onload = () => loadMovies();
</script>
</body>
</html>
