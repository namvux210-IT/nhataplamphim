<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GOLD CINEMA - PREMIUM MOVIE INFO</title>
    <style>
        :root { --gold: #FFD700; --dark: #080808; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; margin: 0; }
        .header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; border-bottom: 2px solid var(--gold); position: sticky; top:0; z-index:100;}
        .logo { color: var(--gold); cursor: pointer; font-size: 24px; font-weight: 900; outline: none; }
        .cat-bar { background: #111; padding: 10px 5%; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { padding: 8px 15px; background: #222; border-radius: 20px; cursor: pointer; outline: none; white-space: nowrap; }
        .cat-item:focus, .cat-item.active { background: var(--gold); color: #000; font-weight: bold; }

        /* Grid Phim */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: #151515; border-radius: 8px; border: 2px solid #222; cursor: pointer; outline: none; transition: 0.3s; }
        .card:focus { transform: scale(1.05); border-color: var(--gold); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-name { padding: 10px; text-align: center; color: var(--gold); font-size: 13px; font-weight: bold; }

        /* MODAL THÔNG TIN PHIM */
        #movie-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 1000; overflow-y: auto; padding: 40px 10%; }
        .modal-content { display: flex; gap: 40px; }
        .modal-poster { width: 300px; border-radius: 10px; border: 2px solid var(--gold); }
        .modal-info { flex: 1; }
        .modal-title { color: var(--gold); font-size: 32px; margin-top: 0; }
        .modal-desc { line-height: 1.6; color: #ccc; margin: 20px 0; max-height: 200px; overflow-y: auto; }
        
        .ep-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn-ep { padding: 10px 20px; background: #222; border: 1px solid var(--gold); color: #fff; cursor: pointer; border-radius: 5px; }
        .btn-ep:focus, .btn-ep.active { background: var(--gold); color: #000; font-weight: bold; }
        
        .btn-watch { margin-top: 30px; padding: 15px 40px; background: var(--gold); color: #000; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; }
        .btn-watch:focus { transform: scale(1.05); box-shadow: 0 0 20px var(--gold); }

        /* PLAYER */
        #player-box { display: none; margin-top: 20px; }
        iframe { width: 100%; height: 60vh; border: 2px solid var(--gold); background: #000; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" tabindex="0" onclick="goHome()">GOLD CINEMA</div>
    <div style="background:#1a1a1a; padding:8px; border-radius:20px; border:1px solid var(--gold)">
        <input type="text" id="search" placeholder="Tìm phim..." style="background:none; border:none; color:#fff; outline:none">
    </div>
</div>

<div class="cat-bar" id="catBar">
    <div class="cat-item active" tabindex="0" onclick="goHome()">Trang Chủ</div>
</div>

<div class="container">
    <h3 id="list-title">Phim Mới Cập Nhật</h3>
    <div id="grid" class="grid"></div>
</div>

<div id="movie-modal">
    <button onclick="closeModal()" style="float:right; background:red; color:#fff; border:none; padding:10px 20px; cursor:pointer">ĐÓNG [X]</button>
    <div class="modal-content" id="modal-body">
        </div>
</div>

<script>
    const clean = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
    let currentLink = "";

    async function loadGenres() {
        const res = await fetch('/api/proxy?genres=all').then(r => r.json());
        const bar = document.getElementById('catBar');
        (res.data?.items || []).forEach(g => {
            bar.innerHTML += `<div class="cat-item" tabindex="0" onclick="loadMovies('','${g.slug}','${g.name}')">${g.name}</div>`;
        });
    }

    async function loadMovies(kw = '', cat = '', name = 'Phim Mới Cập Nhật') {
        document.getElementById('list-title').innerText = name;
        const grid = document.getElementById('grid');
        grid.innerHTML = 'Đang tải...';
        const res = await fetch(`/api/proxy?keyword=${encodeURIComponent(kw)}&category=${cat}`).then(r => r.json());
        const items = res.data?.items || [];
        grid.innerHTML = items.map(m => `
            <div class="card" tabindex="0" onclick="showDetail('${m.slug}')">
                <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=GOLD+CINEMA'">
                <div class="card-name">${m.name}</div>
            </div>
        `).join('');
    }

    // Hiển thị phần giới thiệu và danh sách tập
    window.showDetail = async function(slug) {
        document.getElementById('movie-modal').style.display = 'block';
        document.getElementById('modal-body').innerHTML = 'Đang tải thông tin phim...';
        
        const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
        const movie = res.data.item;
        const episodes = movie.episodes[0]?.server_data || [];
        currentLink = episodes[0]?.link_embed || "";

        document.getElementById('modal-body').innerHTML = `
            <img class="modal-poster" src="${movie.poster_url}">
            <div class="modal-info">
                <h1 class="modal-title">${movie.name}</h1>
                <div style="color:var(--gold)">Năm: ${movie.year} | Thời lượng: ${movie.time}</div>
                <div class="modal-desc">${movie.content || 'Đang cập nhật nội dung...'}</div>
                
                <h3>Danh sách tập:</h3>
                <div class="ep-list">
                    ${episodes.map((e, i) => `
                        <button class="btn-ep ${i===0?'active':''}" tabindex="0" onclick="selectEp('${e.link_embed}', this)">Tập ${e.name}</button>
                    `).join('')}
                </div>

                <button class="btn-watch" id="btn-start" tabindex="0" onclick="startWatch()">BẮT ĐẦU XEM PHIM</button>
                
                <div id="player-box">
                    <iframe id="main-player" allowfullscreen></iframe>
                </div>
            </div>
        `;
        document.getElementById('btn-start').focus();
    };

    window.selectEp = (url, btn) => {
        currentLink = url;
        document.querySelectorAll('.btn-ep').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(document.getElementById('player-box').style.display === 'block') startWatch();
    };

    window.startWatch = () => {
        document.getElementById('player-box').style.display = 'block';
        document.getElementById('main-player').src = currentLink;
        document.getElementById('main-player').focus();
        window.scrollTo({ top: 1000, behavior: 'smooth' });
    };

    window.closeModal = () => {
        document.getElementById('movie-modal').style.display = 'none';
        document.getElementById('main-player').src = "";
    };

    window.goHome = () => loadMovies();
    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') loadMovies(clean(e.target.value));
    };

    window.onload = () => { loadGenres(); loadMovies(); };
</script>
</body>
</html>
