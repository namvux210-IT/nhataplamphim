<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GOLD CINEMA - PREMIUM CATEGORIES</title>
    <style>
        :root { --gold: #FFD700; --dark: #080808; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; margin: 0; }
        
        /* Header & Nav */
        .header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--gold); cursor: pointer; font-size: 24px; font-weight: 900; outline: none; }
        .search-box { background: #1a1a1a; border: 1px solid var(--gold); border-radius: 20px; padding: 8px 15px; width: 300px; }
        input { background: none; border: none; color: #fff; width: 100%; outline: none; }

        /* Category Bar - Tối ưu cho TV */
        .cat-bar { background: #111; padding: 10px 5%; display: flex; gap: 15px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #222; scrollbar-width: none; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-item { padding: 8px 20px; background: #222; border-radius: 20px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; outline: none; font-size: 14px; }
        .cat-item:hover, .cat-item:focus { border-color: var(--gold); color: var(--gold); transform: scale(1.1); }
        .cat-item.active { background: var(--gold); color: #000; font-weight: bold; }

        /* Movie Grid */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .card { background: #151515; border-radius: 10px; overflow: hidden; border: 2px solid #222; transition: 0.3s; cursor: pointer; outline: none; }
        .card:hover, .card:focus { transform: scale(1.05); border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; font-size: 13px; font-weight: bold; color: var(--gold); }

        /* Overlay */
        #overlay { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 1000; }
        iframe { width: 100%; height: 70vh; border: none; }
        .ep-list { padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; }
        .btn-ep { padding: 10px 20px; background: #1a1a1a; border: 1px solid var(--gold); color: #fff; border-radius: 5px; cursor: pointer; }
        .btn-ep.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" tabindex="0" onclick="goHome()">GOLD CINEMA</div>
    <div class="search-box">
        <input type="text" id="search" placeholder="Tìm phim (không dấu)...">
    </div>
</div>

<div class="cat-bar" id="catBar">
    <div class="cat-item active" tabindex="0" onclick="goHome()">Trang Chủ</div>
    </div>

<div class="container">
    <h3 id="title">Phim Mới Cập Nhật</h3>
    <div id="grid" class="grid"></div>
</div>

<div id="overlay">
    <div style="padding:15px; display:flex; justify-content:space-between; background:#111; border-bottom:1px solid var(--gold)">
        <b id="mName" style="color:var(--gold)"></b>
        <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:8px 20px; cursor:pointer; font-weight:bold">ĐÓNG [X]</button>
    </div>
    <iframe id="player" allowfullscreen></iframe>
    <div id="eps" class="ep-list"></div>
</div>

<script>
    const clean = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");

    // 1. Tải danh sách thể loại ngay khi mở app
    async function loadGenres() {
        try {
            const res = await fetch('/api/proxy?genres=all').then(r => r.json());
            const genres = res.data?.items || [];
            const bar = document.getElementById('catBar');
            bar.innerHTML += genres.map(g => `
                <div class="cat-item" tabindex="0" onclick="loadCategory('${g.slug}', '${g.name}')">${g.name}</div>
            `).join('');
        } catch (e) { console.error("Lỗi tải thể loại"); }
    }

    // 2. Tải phim theo thể loại
    window.loadCategory = async function(slug, name) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        event?.target?.classList?.add('active');
        document.getElementById('title').innerText = `Thể loại: ${name}`;
        loadMovies('', slug);
    };

    async function loadMovies(kw = '', cat = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center">Đang tải phim...</p>';
        try {
            const url = `/api/proxy?keyword=${encodeURIComponent(kw)}&category=${cat}`;
            const res = await fetch(url).then(r => r.json());
            const items = res.data?.items || [];
            
            grid.innerHTML = items.map(m => `
                <div class="card" tabindex="0" onclick="openMovie('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/000/FFD700?text=GOLD+CINEMA'">
                    <div class="card-info">${m.name}</div>
                </div>
            `).join('');
        } catch (e) { grid.innerHTML = 'Lỗi kết nối API!'; }
    }

    window.openMovie = async function(slug) {
        document.getElementById('overlay').style.display = 'flex';
        const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
        const movie = res.data.item;
        document.getElementById('mName').innerText = movie.name;
        const list = movie.episodes[0]?.server_data || [];
        document.getElementById('eps').innerHTML = list.map((e, i) => `
            <button class="btn-ep ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        if(list[0]) play(list[0].link_embed, document.querySelector('.btn-ep'));
    };

    window.play = (url, btn) => {
        document.getElementById('player').src = url;
        document.querySelectorAll('.btn-ep').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    };

    window.closePlayer = () => {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('player').src = "";
    };

    window.goHome = () => {
        document.getElementById('search').value = "";
        document.getElementById('title').innerText = "Phim Mới Cập Nhật";
        loadMovies();
    };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') loadMovies(clean(e.target.value));
    };

    // Khởi tạo
    window.onload = () => {
        loadGenres();
        loadMovies();
    };
</script>
</body>
</html>
