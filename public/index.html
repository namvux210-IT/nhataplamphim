<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - PREMIUM</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 160px; }
        @media (max-width: 768px) { :root { --card-w: 130px; } }
        
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Header */
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-size: 22px; font-weight: 900; text-decoration: none; letter-spacing: 1px; }
        .search-box { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 15px; border-radius: 20px; outline: none; width: 150px; transition: 0.3s; }
        .search-box:focus { border-color: var(--gold); width: 200px; }

        /* Hero Slider */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 75vh; position: relative; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 60%); }
        .hero-info { position: absolute; bottom: 10%; left: 5%; right: 5%; z-index: 10; max-width: 600px; }
        .hero-title { font-size: clamp(24px, 5vw, 45px); color: var(--gold); margin: 0; font-weight: 900; line-height: 1.2; }
        .hero-desc { font-size: 15px; color: #ccc; margin: 15px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.6; }

        /* Nút xem ngay */
        .btn-play-hero { background: var(--gold); color: #000; border: none; padding: 12px 35px; border-radius: 50px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-play-hero:hover { transform: scale(1.05); background: #fff; }

        /* Hàng phim & Grid Tìm kiếm */
        .row { padding: 25px 0 10px 5%; }
        .row-title { font-size: 18px; margin-bottom: 15px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 10px; }
        .row-title::before { content: ''; width: 4px; height: 18px; background: var(--gold); border-radius: 2px; }
        
        /* FIX LỖI TÌM KIẾM: Sử dụng flex-wrap cho kết quả tìm kiếm */
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; scrollbar-width: none; padding-bottom: 15px; }
        .list-wrap.search-mode { flex-wrap: wrap; overflow-x: hidden; padding-right: 5%; }
        .list-wrap::-webkit-scrollbar { display: none; }
        
        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; border: 1px solid #222; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card-t { font-size: 13px; margin-top: 10px; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modals */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .box { background: #151515; border: 1px solid #333; border-radius: 20px; max-width: 400px; width: 85%; padding: 30px; text-align: center; }
        #player { background: #000; flex-direction: column; }
        iframe { flex: 1; border: none; }
        .eps { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #111; border-top: 1px solid #222; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #333; padding: 8px 15px; border-radius: 5px; white-space: nowrap; cursor: pointer; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="/" class="logo">GOLD CINEMA</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm kiếm phim...">
</div>

<div id="hero" class="hero-slider"></div>

<div id="content">
    </div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:120px; border-radius:10px; margin-bottom:15px;">
        <h2 id="iTitle" style="margin:0 0 10px 0; color:var(--gold); font-size:20px;"></h2>
        <div id="iMeta" style="margin-bottom:20px; color:#aaa; font-size:14px;"></div>
        <button class="btn-play-hero" style="width:100%; justify-content:center;" onclick="startPhim()">▶ XEM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:20px; cursor:pointer; color:#666; font-size:13px;">ĐÓNG X</p>
    </div>
</div>

<div id="player">
    <div style="padding:10px 20px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <b id="pTitle" style="color:var(--gold);"></b>
        <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:6px 15px; border-radius:4px; cursor:pointer;">THOÁT</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let activeMovie = null;

    // Hàm tạo hàng phim (Fix lỗi kích thước ảnh ở đây)
    async function addRow(title, params = '', isSearch = false) {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap ${isSearch ? 'search-mode' : ''}">
                        ${items.map(m => `
                            <div class="card" onclick="showIntro('${m.slug}')">
                                <img src="${m.poster_url}" loading="lazy">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) { console.error("Lỗi:", title); }
    }

    async function init() {
        // Load Hero Slider (Top 5)
        const res = await fetch('/api/proxy').then(r => r.json());
        const top5 = res.data.items.slice(0, 5);
        
        const heroDetails = await Promise.all(top5.map(async (m) => {
            const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
            return d.data.item;
        }));

        document.getElementById('hero').innerHTML = heroDetails.map(m => `
            <div class="hero-item">
                <img src="${m.thumb_url || m.poster_url}" class="hero-img">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <h2 class="hero-title">${m.name}</h2>
                    <div class="hero-desc">${m.content.replace(/<[^>]*>/g, '')}</div>
                    <button class="btn-play-hero" onclick="showIntro('${m.slug}')">▶ XEM PHIM</button>
                </div>
            </div>
        `).join('');

        // Tự động chuyển slide
        setInterval(() => {
            const h = document.getElementById('hero');
            h.scrollLeft += h.offsetWidth;
            if (h.scrollLeft >= h.scrollWidth - h.offsetWidth) h.scrollLeft = 0;
        }, 5000);

        // Load các danh mục trang chủ
        await addRow('PHIM MỚI CẬP NHẬT');
        await addRow('HÀNH ĐỘNG - VÕ THUẬT', 'cat=hanh-dong');
        await addRow('TÌNH CẢM LÃNG MẠN', 'cat=tinh-cam');
        await addRow('PHIM TRUNG QUỐC', 'nation=trung-quoc');
    }

    window.showIntro = async (slug) => {
        const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
        activeMovie = r.data.item;
        document.getElementById('iTitle').innerText = activeMovie.name;
        document.getElementById('iImg').src = activeMovie.poster_url;
        document.getElementById('iMeta').innerHTML = `${activeMovie.year} • ${activeMovie.episode_current}`;
        document.getElementById('intro').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    };

    window.startPhim = () => {
        const srv = activeMovie.episodes[0].server_data;
        document.getElementById('pTitle').innerText = activeMovie.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => { document.getElementById('intro').style.display = 'none'; document.body.style.overflow = 'auto'; };
    window.closePlayer = () => { document.getElementById('player').style.display = 'none'; document.getElementById('video').src = ''; document.body.style.overflow = 'auto'; };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`KẾT QUẢ TÌM KIẾM: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`, true);
        }
    };

    window.onload = init;
</script>
</body>
</html>
