<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BossMovie - Đa Nguồn</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; margin: 0; }
        .nav { background: #000; padding: 10px 5%; display: flex; justify-content: space-between; border-bottom: 2px solid #00d2ff; sticky: top; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #111; border-radius: 8px; cursor: pointer; text-align: center; overflow: hidden; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        #overlay { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 999; }
        iframe { width: 100%; height: 60vh; border: none; }
        .eps { padding: 15px; display: flex; flex-wrap: wrap; gap: 8px; overflow-y: auto; }
        .ep-btn { padding: 8px 12px; background: #222; border-radius: 4px; cursor: pointer; border: 1px solid #333; }
        .ep-btn.active { background: #00d2ff; color: #000; }
    </style>
</head>
<body>

<div class="nav">
    <b style="color:#00d2ff">BOSSMOVIE</b>
    <div>
        <select id="source" onchange="switchSource(this.value)" style="padding:5px; background:#222; color:#fff; border:1px solid #00d2ff">
            <option value="kkphim">KKPHIM</option>
            <option value="nguonc">NGUONC</option>
            <option value="ophim">OPHIM</option>
        </select>
        <input type="text" id="search" placeholder="Tìm phim..." style="padding:5px; border-radius:5px; border:none;">
    </div>
</div>

<div id="grid" class="grid"></div>

<div id="overlay">
    <div style="padding:10px; display:flex; justify-content:space-between; background:#111;">
        <span id="mName"></span>
        <button onclick="closeP()" style="background:red; color:#fff; border:none; padding:5px 15px; cursor:pointer;">ĐÓNG</button>
    </div>
    <iframe id="player" allowfullscreen></iframe>
    <div id="epList" class="eps"></div>
</div>

<script>
    window.currentSource = 'kkphim';

    // Đảm bảo hàm luôn sẵn sàng để tránh ReferenceError
    window.switchSource = function(src) {
        window.currentSource = src;
        loadMovies();
    };

    async function loadMovies(keyword = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center">Đang tải...</p>';
        
        try {
            const res = await fetch(`/api/${window.currentSource}?keyword=${encodeURIComponent(keyword)}`).then(r => r.json());
            
            let items = [];
            // PHÂN TÁCH DỰA TRÊN LINK MẪU BẠN CUNG CẤP
            if (window.currentSource === 'nguonc') {
                // Link NguonC trả về danh sách trong mảng data
                items = res.data || []; 
            } else {
                // KKPhim và Ophim trả về trong data.items
                items = res.data?.items || []; 
            }

            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center">Không tìm thấy phim.</p>';
                return;
            }

            grid.innerHTML = items.map(m => {
                let img = m.poster_url || m.thumb_url || "";
                if (img && !img.includes('http')) img = `https://phimimg.com/${img}`;
                return `
                    <div class="card" onclick="openMovie('${m.slug}')">
                        <img src="${img}" onerror="this.src='https://placehold.co/200x300?text=Lỗi+Ảnh'">
                        <div style="padding:10px; font-size:12px; font-weight:bold">${m.name}</div>
                    </div>`;
            }).join('');
        } catch (e) {
            grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:red">Lỗi kết nối API Proxy!</p>';
        }
    }

    window.openMovie = async function(slug) {
        document.getElementById('overlay').style.display = 'flex';
        const epDiv = document.getElementById('epList');
        epDiv.innerHTML = 'Đang tải tập phim...';
        
        try {
            const res = await fetch(`/api/${window.currentSource}?path=${slug}`).then(r => r.json());
            
            // Bóc tách dữ liệu chi tiết
            let movie = (window.currentSource === 'nguonc') ? res.movie : (res.movie || res.data?.item);
            let episodes = movie.episodes || [];
            
            document.getElementById('mName').innerText = movie.name;

            // Tìm server chứa link tập phim
            const server = episodes.find(s => (s.items || s.server_data || []).length > 0) || episodes[0];
            const list = server.items || server.server_data || [];

            epDiv.innerHTML = list.map((e, i) => `
                <div class="ep-btn ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</div>
            `).join('');

            if(list[0]) play(list[0].link_embed, epDiv.querySelector('.ep-btn'));
        } catch (e) {
            epDiv.innerHTML = '<p style="color:red; text-align:center; width:100%">Nguồn này đang bảo trì phim này!</p>';
        }
    };
</script>
</body>
</html>
