<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE-MOVIE | PRO VERSION</title>
    <style>
        :root { --main: #00d2ff; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .nav { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--main); text-decoration: none; text-shadow: 0 0 10px var(--main); }
        .search-box { display: flex; gap: 10px; margin: 20px 5%; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; }
        button { padding: 10px 25px; background: var(--main); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 5% 50px; }
        .card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; display: block; }
        .card-t { padding: 10px; font-size: 13px; text-align: center; margin: 0; font-weight: bold; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .loading { grid-column: 1/-1; text-align: center; padding: 50px; color: var(--main); font-weight: bold; }
        
        /* Player Overlay */
        .player { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        iframe { width: 100%; flex: 1; border: none; background: #000; }
        .eps { padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; background: #111; max-height: 200px; overflow-y: auto; border-top: 1px solid #222; }
        .ep { padding: 8px 15px; background: #222; border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .ep:hover { background: #333; }
        .ep.active { background: var(--main); color: #000; font-weight: bold; }
        .close-btn { color: #fff; background: #ff4444; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="logo">BLUE-MOVIE</a>
        <div id="status" style="font-size: 12px; color: #00ff00;">● Server Proxy Active</div>
    </nav>

    <div class="search-box">
        <input type="text" id="k" placeholder="Tìm tên phim (ví dụ: Vây hãm, Trò chơi con mực)..." onkeypress="if(event.key==='Enter') search()">
        <button onclick="search()">TÌM KIẾM</button>
    </div>

    <div id="grid" class="grid"></div>

    <div id="player" class="player">
        <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #000;">
            <b id="m-name" style="color: var(--main); font-size: 18px;">Đang tải...</b>
            <div class="close-btn" onclick="closePlayer()">ĐÓNG X</div>
        </div>
        <iframe id="vid" src="" allowfullscreen></iframe>
        <div id="eps" class="eps"></div>
    </div>

    <script>
        const PROXY = "/api/proxy?path=";
        const IMG_HOST = "https://img.otruyenapi.com/uploads/movies/";
        // Proxy ảnh để tránh lỗi 403 Forbidden
        const IMG_PROXY = "https://images.weserv.nl/?url=";

        async function load(path) {
            const g = document.getElementById('grid');
            g.innerHTML = '<div class="loading">ĐANG TẢI DỮ LIỆU PHIM...</div>';
            try {
                const res = await fetch(PROXY + encodeURIComponent(path));
                const data = await res.json();
                
                // Khớp với cấu trúc trả về từ OPhim
                const items = data.items || (data.data && data.data.items) || [];
                
                if (items.length === 0) {
                    g.innerHTML = '<div class="loading">Không tìm thấy phim nào phù hợp.</div>';
                    return;
                }

                g.innerHTML = items.map(m => {
                    // Xử lý link ảnh qua Proxy
                    const thumb = m.thumb_url.includes('http') ? m.thumb_url : IMG_HOST + m.thumb_url;
                    const proxyThumb = IMG_PROXY + encodeURIComponent(thumb);

                    return `
                        <div class="card" onclick="view('${m.slug}')">
                            <img src="${proxyThumb}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
                            <p class="card-t">${m.name}</p>
                        </div>
                    `;
                }).join('');
            } catch (e) { 
                g.innerHTML = '<div class="loading" style="color:red">Lỗi kết nối Proxy!</div>'; 
            }
        }

        async function search() {
            const k = document.getElementById('k').value;
            if(k) load('tim-kiem?keyword=' + encodeURIComponent(k));
        }

        async function view(slug) {
            try {
                const res = await fetch(PROXY + encodeURIComponent('phim/' + slug));
                const data = await res.json();
                
                const movie = data.movie || (data.data && data.data.item);
                const episodes = data.episodes || (data.data && data.data.item.episodes);
                
                if (!movie || !episodes) return;

                document.getElementById('player').style.display = 'flex';
                document.getElementById('m-name').innerText = movie.name;
                
                const sv = episodes[0].server_data;
                const epDiv = document.getElementById('eps');
                
                epDiv.innerHTML = sv.map((e, i) => `
                    <div class="ep ${i===0?'active':''}" onclick="play('${e.link_embed}', this)">Tập ${e.name}</div>
                `).join('');
                
                play(sv[0].link_embed, epDiv.querySelector('.ep'));
            } catch (e) { 
                alert("Lỗi tải link phim!"); 
            }
        }

        function play(url, el) {
            document.getElementById('vid').src = url;
            document.querySelectorAll('.ep').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('vid').src = "";
        }

        window.onload = () => load('danh-sach/phim-moi-cap-nhat');
    </script>
</body>
</html>
