<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD CINEMA</title>
    <style>
        :root { --gold: #FFD700; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* Header gọn nhẹ */
        .nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 100; }
        .logo { color: var(--gold); font-weight: 900; font-size: 20px; cursor: pointer; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 8px 15px; border-radius: 5px; outline: none; width: 140px; }

        /* Danh sách phim */
        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; } }

        .item { cursor: pointer; border-radius: 4px; overflow: hidden; border: 1px solid #111; transition: 0.2s; background: #111; }
        .item:focus, .item:hover { border-color: var(--gold); transform: scale(1.05); outline: none; }
        .item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .name { padding: 6px; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bbb; }

        /* Lớp phủ Xem phim (Tối ưu TV/Mobile) */
        #player-overlay { position: fixed; inset: 0; background: #000; display: none; z-index: 1000; }
        .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .player-info { padding: 15px; overflow-y: auto; height: calc(100vh - 56.25vw); }
        .p-title { color: var(--gold); font-size: 18px; margin: 0; font-weight: bold; }
        
        .ep-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .ep-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .ep-btn:focus, .ep-btn.active { background: var(--gold); color: #000; border-color: #fff; font-weight: bold; outline: none; }

        .btn-close { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: #fff; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; z-index: 1001; cursor: pointer; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo" onclick="location.reload()">GOLD CINEMA</div>
    <input type="text" id="search" placeholder="Tìm phim...">
</div>

<div class="container">
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <button class="btn-close" onclick="closePlayer()">ĐÓNG X</button>
    <div class="player-wrap"><iframe id="video" allowfullscreen></iframe></div>
    <div class="player-info">
        <h2 id="movieName" class="p-title">Tên Phim</h2>
        <div id="eps" class="ep-list"></div>
    </div>
</div>

<script>
    async function load(kw = '') {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<p style="text-align:center;width:100%">Đang tải...</p>';
        const url = kw ? `/api/proxy?keyword=${encodeURIComponent(kw)}` : `/api/proxy`;
        try {
            const res = await fetch(url).then(r => r.json());
            const items = res.data?.items || [];
            grid.innerHTML = items.map(m => `
                <div class="item" tabindex="0" onclick="openPhim('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/333?text=PHIM'">
                    <div class="name">${m.name}</div>
                </div>
            `).join('');
        } catch(e) { grid.innerHTML = 'Lỗi kết nối!'; }
    }

    window.openPhim = async function(slug) {
        const overlay = document.getElementById('player-overlay');
        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
        
        try {
            const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
            const m = res.data.item;
            const srv = m.episodes[0]?.server_data || [];
            
            document.getElementById('movieName').innerText = m.name;
            document.getElementById('video').src = srv[0]?.link_embed || "";
            
            document.getElementById('eps').innerHTML = srv.map((e, i) => `
                <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
            `).join('');
        } catch(e) { alert('Lỗi tải phim!'); }
    };

    window.changeEp = (url, btn) => {
        document.getElementById('video').src = url;
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        btn.focus();
    };

    window.closePlayer = () => {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video').src = "";
        document.body.style.overflow = 'auto';
    };

    document.getElementById('search').onkeypress = (e) => { if(e.key === 'Enter') load(e.target.value); };
    window.onload = () => load();
</script>
</body>
</html>
