<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA</title>
    <style>
        :root { --gold: #FFD700; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; padding: 20px 5%; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        
        .card { cursor: pointer; background: #111; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
        .card:hover { border-color: var(--gold); transform: scale(1.03); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .card-t { padding: 8px; font-size: 12px; text-align: center; }

        /* Intro Modal */
        #intro { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .box { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid var(--gold); width: 100%; max-width: 400px; text-align: center; }
        .box img { width: 120px; border-radius: 8px; margin-bottom: 15px; }
        .tag { font-size: 13px; color: #aaa; margin: 5px 0; }
        .tag b { color: var(--gold); }
        .btn-play { background: var(--gold); color: #000; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; width: 100%; cursor: pointer; margin: 15px 0; font-size: 16px; }

        /* Fullscreen Player */
        #player { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
        .p-head { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; }
        iframe { flex: 1; border: none; }
        .eps { padding: 10px; display: flex; gap: 8px; overflow-x: auto; background: #000; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 15px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav"><b style="color:var(--gold); font-size:22px;">GOLD CINEMA</b></div>
    <div id="grid" class="grid"></div>

    <div id="intro">
        <div class="box">
            <img id="iImg" src="">
            <h2 id="iTitle" style="margin:10px 0; font-size:20px;"></h2>
            <div class="tag" id="iInfo"></div>
            <div class="tag" id="iGenre"></div>
            <button class="btn-play" onclick="start()">BẮT ĐẦU XEM</button>
            <button onclick="document.getElementById('intro').style.display='none'" style="background:none; border:none; color:#666; cursor:pointer;">Đóng</button>
        </div>
    </div>

    <div id="player">
        <div class="p-head">
            <span id="pTitle" style="color:var(--gold); font-weight:bold;"></span>
            <button onclick="location.reload()" style="background:red; color:#fff; border:none; padding:5px 12px; border-radius:4px; font-weight:bold;">THOÁT [X]</button>
        </div>
        <iframe id="ifr" allowfullscreen></iframe>
        <div id="eps" class="eps"></div>
    </div>

    <script>
        let cur = null;
        async function load() {
            const r = await fetch('/api/proxy').then(res => res.json());
            document.getElementById('grid').innerHTML = r.data.items.map(m => `
                <div class="card" onclick="show('${m.slug}')">
                    <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/444?text=IMAGE'">
                    <div class="card-t">${m.name}</div>
                </div>
            `).join('');
        }

        window.show = async (slug) => {
            const r = await fetch('/api/proxy?path=' + slug).then(res => res.json());
            cur = r.data.item;
            document.getElementById('iTitle').innerText = cur.name;
            document.getElementById('iImg').src = cur.poster_url;
            document.getElementById('iInfo').innerHTML = `Năm: <b>${cur.year}</b> • Tập: <b>${cur.episode_current}</b>`;
            document.getElementById('iGenre').innerHTML = `Thể loại: <b>${cur.category.map(c=>c.name).join(', ')}</b>`;
            document.getElementById('intro').style.display = 'flex';
        };

        window.start = () => {
            const s = cur.episodes[0].server_data;
            document.getElementById('pTitle').innerText = cur.name;
            document.getElementById('ifr').src = s[0].link_embed;
            document.getElementById('eps').innerHTML = s.map((e,i) => `
                <button class="ep-btn ${i==0?'active':''}" onclick="document.getElementById('ifr').src='${e.link_embed}'; document.querySelectorAll('.ep-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active');">Tập ${e.name}</button>
            `).join('');
            document.getElementById('intro').style.display = 'none';
            document.getElementById('player').style.display = 'flex';
        };
        load();
    </script>
</body>
</html>
