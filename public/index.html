<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhoPhimChat - Phim phải chất nhất</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 180px; }
        @media (max-width: 600px) { :root { --card-w: 130px; } }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .logo { color: var(--gold); font-size: 24px; font-weight: 900; text-decoration: none; }
        .search-box { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: 180px; }

        /* Focus cho Android TV Remote */
        .card:focus, .btn-hero:focus, .ep-btn:focus, .search-box:focus {
            outline: none !important; border: 3px solid var(--gold) !important; transform: scale(1.05); z-index: 10;
        }

        /* Hero Slider Hiện Đại */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 70vh; min-height: 400px; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 90%); }
        .hero-info { position: absolute; bottom: 10%; left: 5%; right: 5%; max-width: 800px; }
        .hero-title { font-size: clamp(30px, 5vw, 50px); color: var(--gold); margin: 0; font-weight: 900; }
        .hero-meta { display: flex; gap: 10px; margin: 15px 0; font-size: 14px; font-weight: bold; }
        .hero-meta span { background: rgba(255,215,0,0.2); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--gold); }
        .hero-desc { color: #ccc; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 20px; }
        .btn-hero { background: var(--gold); color: #000; border: none; padding: 12px 35px; border-radius: 6px; font-weight: 800; cursor: pointer; }

        /* Rows Phim lướt ngang */
        .row { padding: 25px 0 0 5%; }
        .row-title { font-size: 20px; color: var(--gold); font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .list-wrap::-webkit-scrollbar { display: none; }
        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; border-radius: 8px; overflow: hidden; background: #111; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { font-size: 13px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal & Player */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .box { background: #1a1a1a; border-radius: 20px; max-width: 450px; width: 90%; padding: 30px; text-align: center; }
        #player { background: #000; flex-direction: column; }
        iframe { flex: 1; border: none; }
        .eps { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #111; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="#" class="logo" onclick="location.reload()">KhoPhimChat</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm kiếm phim..." tabindex="1">
</div>

<div id="hero" class="hero-slider"></div>
<div id="content"></div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:120px; border-radius:10px; margin-bottom:15px;">
        <h2 id="iTitle" style="color:var(--gold); margin:0;"></h2>
        <div id="iMeta" style="margin:20px 0; text-align: left; font-size: 14px; color: #bbb; line-height: 1.8;"></div>
        <button class="btn-hero" id="btnStart" tabindex="0" onclick="startPhim()" style="width:100%">XEM PHIM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:20px; cursor:pointer; font-weight:bold; color:#555;">[ ĐÓNG ]</p>
    </div>
</div>

<div id="player">
    <div style="padding:15px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <b id="pTitle" style="color:var(--gold);"></b>
        <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:8px 20px; border-radius:5px; cursor:pointer;">THOÁT</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let activeMovie = null;

    async function addRow(title, params = '') {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap">
                        ${items.map(m => `
                            <div class="card" tabindex="0" onclick="showIntro('${m.slug}')">
                                <img src="${m.poster_url}" loading="lazy">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) {}
    }

    async function init() {
        // Hero Slider: Phim mới cập nhật
        const res = await fetch('/api/proxy').then(r => r.json());
        const top5 = res.data.items.slice(0, 5);
        const heroData = await Promise.all(top5.map(async (m) => {
            const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
            return d.data.item;
        }));

        document.getElementById('hero').innerHTML = heroData.map(m => `
            <div class="hero-item">
                <img src="${m.thumb_url || m.poster_url}" class="hero-img">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <div class="hero-meta">
                        <span>🌍 ${m.country[0]?.name}</span>
                        <span>🎞️ ${m.episode_current}</span>
                        <span>📅 ${m.year}</span>
                    </div>
                    <h1 class="hero-title">${m.name}</h1>
                    <p class="hero-desc">${m.content.replace(/<[^>]*>/g, '')}</p>
                    <button class="btn-hero" tabindex="0" onclick="showIntro('${m.slug}')">XEM NGAY</button>
                </div>
            </div>
        `).join('');

        // CÁC DANH MỤC PHÂN LOẠI CHUẨN
        await addRow('🔥 Mới Cập Nhật', '');
        await addRow('⚔️ Phim Hành Động', 'cat=hanh-dong');
        await addRow('💖 Phim Tình Cảm', 'cat=tinh-cam');
        await addRow('🐉 Phim Trung Quốc', 'nation=trung-quoc');
        await addRow('🎭 Phim Hàn Quốc', 'nation=han-quoc');
        await addRow('📅 Cực Phẩm 2024', 'year=2024');
    }

    window.showIntro = async (slug) => {
        const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
        activeMovie = r.data.item;
        document.getElementById('iTitle').innerText = activeMovie.name;
        document.getElementById('iImg').src = activeMovie.poster_url;
        document.getElementById('iMeta').innerHTML = `
            Quốc gia: <b>${activeMovie.country[0]?.name}</b><br>
            Thể loại: <b>${activeMovie.category.map(c => c.name).join(', ')}</b><br>
            Số tập: <b>${activeMovie.episode_current}</b><br>
            Năm: <b>${activeMovie.year}</b>
        `;
        document.getElementById('intro').style.display = 'flex';
        document.getElementById('btnStart').focus();
    };

    window.startPhim = () => {
        const srv = activeMovie.episodes[0].server_data;
        document.getElementById('pTitle').innerText = activeMovie.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => document.getElementById('intro').style.display = 'none';
    window.closePlayer = () => { document.getElementById('player').style.display = 'none'; document.getElementById('video').src = ''; };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`🔍 Kết quả cho: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`);
        }
    };

    window.onload = init;
</script>
</body>
</html>
