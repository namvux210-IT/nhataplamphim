<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - NEW UPDATE</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 180px; }
        @media (max-width: 1024px) { :root { --card-w: 150px; } }
        @media (max-width: 600px) { :root { --card-w: 120px; } }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Nav */
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-size: clamp(18px, 4vw, 26px); font-weight: 900; text-decoration: none; }
        .search-box { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: clamp(100px, 20vw, 250px); }

        /* Focus State cho Android TV & Keyboard */
        .card:focus, .btn-play-hero:focus, .ep-btn:focus, .search-box:focus {
            outline: none !important; border: 3px solid var(--gold) !important; transform: scale(1.05); z-index: 10;
        }

        /* Hero Slider (Phim mới cập nhật trong ngày) */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: clamp(350px, 75vh, 850px); position: relative; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 80%); }
        .hero-info { position: absolute; bottom: 12%; left: 5%; right: 5%; z-index: 10; max-width: 800px; }
        .hero-tag { background: #ff4d4d; color: #fff; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-bottom: 10px; display: inline-block; text-transform: uppercase; }
        .hero-title { font-size: clamp(26px, 5vw, 50px); color: var(--gold); margin: 0; font-weight: 900; }
        .hero-desc { font-size: clamp(14px, 2vw, 18px); color: #ddd; margin: 15px 0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .btn-play-hero { background: var(--gold); color: #000; border: none; padding: 14px 40px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }

        /* Rows */
        .row { padding: 30px 0 10px 5%; }
        .row-title { font-size: clamp(16px, 3vw, 22px); margin-bottom: 15px; font-weight: bold; color: var(--gold); }
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .list-wrap::-webkit-scrollbar { display: none; }
        .list-wrap.search-mode { flex-wrap: wrap; overflow-x: hidden; padding-right: 5%; }

        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; border-radius: 10px; overflow: hidden; background: #111; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { font-size: 13px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modals */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; max-width: 500px; width: 85%; padding: 30px; text-align: center; }
        #player { background: #000; flex-direction: column; }
        iframe { flex: 1; border: none; }
        .eps { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #111; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="/" class="logo">GOLD CINEMA</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm phim..." tabindex="1">
</div>

<div id="hero" class="hero-slider"></div>

<div id="content"></div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:130px; border-radius:10px; margin-bottom:15px;">
        <h2 id="iTitle" style="color:var(--gold); margin:0 0 10px 0;"></h2>
        <div id="iMeta" style="color:#aaa; font-size:14px; margin-bottom:20px;"></div>
        <button class="btn-play-hero" id="btnStart" tabindex="0" onclick="startPhim()" style="width:100%">XEM PHIM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:20px; cursor:pointer; color:#555; font-weight:bold;">ĐÓNG [X]</p>
    </div>
</div>

<div id="player">
    <div style="padding:15px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <b id="pTitle" style="color:var(--gold);"></b>
        <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:8px 20px; border-radius:5px; font-weight:bold; cursor:pointer;">THOÁT</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let activeMovie = null;

    async function addRow(title, params = '', isSearch = false) {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap ${isSearch ? 'search-mode' : ''}">
                        ${items.map(m => `
                            <div class="card" tabindex="0" onclick="showIntro('${m.slug}')" onkeypress="if(event.key==='Enter') showIntro('${m.slug}')">
                                <img src="${m.poster_url}" loading="lazy">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) { console.error("Lỗi:", title); }
    }

    async function init() {
        // Lấy danh sách phim mới nhất để làm đề xuất
        const res = await fetch('/api/proxy').then(r => r.json());
        const newUpdates = res.data.items.slice(0, 5); // Lấy 5 phim mới nhất vừa cập nhật
        
        // Fetch chi tiết để có nội dung mô tả
        const heroData = await Promise.all(newUpdates.map(async (m) => {
            const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
            return d.data.item;
        }));

        document.getElementById('hero').innerHTML = heroData.map(m => `
            <div class="hero-item">
                <img src="${m.thumb_url || m.poster_url}" class="hero-img">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <span class="hero-tag">Mới cập nhật hôm nay</span>
                    <h1 class="hero-title">${m.name}</h1>
                    <div class="hero-desc">${m.content.replace(/<[^>]*>/g, '')}</div>
                    <button class="btn-play-hero" tabindex="0" onclick="showIntro('${m.slug}')">XEM CHI TIẾT</button>
                </div>
            </div>
        `).join('');

        // Tự động chuyển slide
        setInterval(() => {
            const h = document.getElementById('hero');
            h.scrollLeft += h.offsetWidth;
            if (h.scrollLeft >= h.scrollWidth - h.offsetWidth) h.scrollLeft = 0;
        }, 7000);

        // Load các danh mục bên dưới
        await addRow('🔥 PHIM MỚI CẬP NHẬT TRONG NGÀY');
        await addRow('⚔️ HÀNH ĐỘNG GAY CẤN', 'cat=hanh-dong');
        await addRow('🐉 CỔ TRANG - KIẾM HIỆP', 'nation=trung-quoc');
        await addRow('💖 TÌNH CẢM - TÂM LÝ', 'cat=tinh-cam');
    }

    window.showIntro = async (slug) => {
        const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
        activeMovie = r.data.item;
        document.getElementById('iTitle').innerText = activeMovie.name;
        document.getElementById('iImg').src = activeMovie.poster_url;
        document.getElementById('iMeta').innerText = `${activeMovie.year} • ${activeMovie.episode_current} • ${activeMovie.category[0].name}`;
        document.getElementById('intro').style.display = 'flex';
        document.getElementById('btnStart').focus();
    };

    window.startPhim = () => {
        const srv = activeMovie.episodes[0].server_data;
        document.getElementById('pTitle').innerText = activeMovie.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => document.getElementById('intro').style.display = 'none';
    window.closePlayer = () => { document.getElementById('player').style.display = 'none'; document.getElementById('video').src = ''; };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`🔍 KẾT QUẢ CHO: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`, true);
        }
    };

    window.onload = init;
</script>
</body>
</html>
