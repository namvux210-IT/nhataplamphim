<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - PREMIUM</title>
    <style>
        :root { --gold: #FFD700; --bg: #0b0b0b; --card-w: 180px; }
        @media (max-width: 1024px) { :root { --card-w: 150px; } }
        @media (max-width: 600px) { :root { --card-w: 120px; } }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-size: 22px; font-weight: 900; text-decoration: none; }
        .search-box { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; width: 160px; }

        /* Focus cho TV Remote */
        .card:focus, .btn-play-hero:focus, .ep-btn:focus, .search-box:focus {
            outline: none !important; border: 3px solid var(--gold) !important; transform: scale(1.05); z-index: 10;
        }

        /* Hero Slider */
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 70vh; min-height: 400px; background: #000; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 80%); }
        
        .hero-info { position: absolute; bottom: 12%; left: 5%; right: 5%; z-index: 10; max-width: 800px; }
        .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 12px; }
        .hero-meta span { background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,215,0,0.3); }
        .hero-title { font-size: clamp(24px, 5vw, 45px); color: var(--gold); margin: 0; font-weight: 900; }
        .hero-desc { font-size: 14px; color: #bbb; margin: 15px 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .btn-play-hero { background: var(--gold); color: #000; border: none; padding: 12px 30px; border-radius: 6px; font-weight: 800; cursor: pointer; }

        /* Row Phim */
        .row { padding: 20px 0 10px 5%; }
        .row-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; color: var(--gold); }
        .list-wrap { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .list-wrap.search-mode { flex-wrap: wrap; }
        
        .card { min-width: var(--card-w); max-width: var(--card-w); cursor: pointer; transition: 0.3s; border-radius: 8px; overflow: hidden; background: #111; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-t { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modals */
        #intro, #player { position: fixed; inset: 0; z-index: 9999; display: none; }
        #intro { background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; max-width: 450px; width: 90%; padding: 25px; text-align: center; }
        #iMeta { text-align: left; background: #222; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 13px; line-height: 1.6; }

        #player { background: #000; flex-direction: column; }
        iframe { flex: 1; border: none; }
        .eps { display: flex; gap: 8px; padding: 12px; overflow-x: auto; background: #111; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .ep-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="#" class="logo" onclick="location.reload()">GOLD CINEMA</a>
    <input type="text" id="search" class="search-box" placeholder="Tìm phim..." tabindex="1">
</div>

<div id="hero" class="hero-slider">
    <div style="width:100%; display:flex; align-items:center; justify-content:center; color:#555;">Đang tải phim đề xuất...</div>
</div>

<div id="content"></div>

<div id="intro">
    <div class="box">
        <img id="iImg" style="width:100px; border-radius:8px; margin-bottom:10px;">
        <h2 id="iTitle" style="color:var(--gold); margin:0; font-size: 20px;"></h2>
        <div id="iMeta"></div>
        <button class="btn-play-hero" id="btnStart" tabindex="0" onclick="startPhim()" style="width:100%">XEM NGAY</button>
        <p onclick="closeIntro()" style="margin-top:15px; cursor:pointer; color:#666; font-size:12px;">ĐÓNG</p>
    </div>
</div>

<div id="player">
    <div style="padding:10px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <b id="pTitle" style="color:var(--gold); font-size:14px;"></b>
        <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:5px 15px; border-radius:4px; cursor:pointer;">THOÁT</button>
    </div>
    <iframe id="video" allowfullscreen></iframe>
    <div id="eps" class="eps"></div>
</div>

<script>
    let movieData = null;

    async function addRow(title, params = '', isSearch = false) {
        try {
            const res = await fetch(`/api/proxy?${params}`).then(r => r.json());
            const items = res.data?.items || [];
            if(items.length === 0) return;

            const rowHtml = `
                <div class="row">
                    <div class="row-title">${title}</div>
                    <div class="list-wrap ${isSearch ? 'search-mode' : ''}">
                        ${items.map(m => `
                            <div class="card" tabindex="0" onclick="showIntro('${m.slug}')">
                                <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/333?text=NO+IMAGE'">
                                <div class="card-t">${m.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML += rowHtml;
        } catch(e) { console.error("Lỗi API:", title); }
    }

    async function init() {
        try {
            const res = await fetch('/api/proxy').then(r => r.json());
            if(!res || !res.data) throw new Error("API Error");

            const top5 = res.data.items.slice(0, 5);
            const heroDetails = await Promise.all(top5.map(async (m) => {
                const d = await fetch(`/api/proxy?path=${m.slug}`).then(r => r.json());
                return d.data.item;
            }));

            document.getElementById('hero').innerHTML = heroDetails.map(m => `
                <div class="hero-item">
                    <img src="${m.thumb_url || m.poster_url}" class="hero-img">
                    <div class="hero-overlay"></div>
                    <div class="hero-info">
                        <div class="hero-meta">
                            <span>📅 ${m.year}</span>
                            <span>🌍 ${m.country[0]?.name || 'N/A'}</span>
                            <span>🎭 ${m.category[0]?.name || 'N/A'}</span>
                        </div>
                        <h1 class="hero-title">${m.name}</h1>
                        <div class="hero-desc">${m.content.replace(/<[^>]*>/g, '')}</div>
                        <button class="btn-play-hero" tabindex="0" onclick="showIntro('${m.slug}')">CHI TIẾT</button>
                    </div>
                </div>
            `).join('');

            await addRow('🔥 PHIM MỚI CẬP NHẬT');
            await addRow('⚔️ HÀNH ĐỘNG', 'cat=hanh-dong');
            await addRow('🐉 TRUNG QUỐC', 'nation=trung-quoc');
        } catch(e) {
            document.getElementById('hero').innerHTML = '<div style="padding:50px; text-align:center;">Lỗi kết nối Server Proxy. Vui lòng kiểm tra lại backend!</div>';
        }
    }

    window.showIntro = async (slug) => {
        const r = await fetch(`/api/proxy?path=${slug}`).then(res => res.json());
        movieData = r.data.item;
        document.getElementById('iTitle').innerText = movieData.name;
        document.getElementById('iImg').src = movieData.poster_url;
        document.getElementById('iMeta').innerHTML = `
            • Quốc gia: <b>${movieData.country[0]?.name}</b><br>
            • Thể loại: <b>${movieData.category[0]?.name}</b><br>
            • Năm: <b>${movieData.year}</b><br>
            • Tập: <b>${movieData.episode_current}</b>
        `;
        document.getElementById('intro').style.display = 'flex';
        document.getElementById('btnStart').focus();
    };

    window.startPhim = () => {
        const srv = movieData.episodes[0].server_data;
        document.getElementById('pTitle').innerText = movieData.name;
        document.getElementById('video').src = srv[0].link_embed;
        document.getElementById('eps').innerHTML = srv.map((e, i) => `
            <button class="ep-btn ${i===0?'active':''}" tabindex="0" onclick="changeEp('${e.link_embed}', this)">Tập ${e.name}</button>
        `).join('');
        document.getElementById('intro').style.display = 'none';
        document.getElementById('player').style.display = 'flex';
    };

    window.changeEp = (u, b) => {
        document.getElementById('video').src = u;
        document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    };

    window.closeIntro = () => document.getElementById('intro').style.display = 'none';
    window.closePlayer = () => { document.getElementById('player').style.display = 'none'; document.getElementById('video').src = ''; };

    document.getElementById('search').onkeypress = (e) => {
        if(e.key === 'Enter') {
            document.getElementById('content').innerHTML = '';
            document.getElementById('hero').style.display = 'none';
            addRow(`KẾT QUẢ: "${e.target.value}"`, `keyword=${encodeURIComponent(e.target.value)}`, true);
        }
    };

    window.onload = init;
</script>
</body>
</html>
