<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD CINEMA - MODERN</title>
    <style>
        :root { --gold: #FFD700; --bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }

        /* Header */
        .header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: var(--gold); cursor: pointer; text-transform: uppercase; }
        .search-bar { background: #222; border: 1px solid #444; border-radius: 20px; padding: 5px 15px; width: 250px; display: flex; }
        .search-bar input { background: none; border: none; color: #fff; outline: none; width: 100%; }

        /* Movie Grid */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; } }

        /* Card Style - LUÔN HIỆN TÊN */
        .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid #333; display: flex; flex-direction: column; }
        .movie-card:hover { transform: scale(1.05); border-color: var(--gold); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2); }
        
        .poster-wrapper { position: relative; width: 100%; aspect-ratio: 2/3; background: #000; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .movie-title { 
            padding: 10px; 
            font-size: 13px; 
            font-weight: 600; 
            text-align: center; 
            color: #eee;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }
        .movie-card:hover .movie-title { color: var(--gold); }

        /* Modal View */
        #movie-detail { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 1000; overflow-y: auto; padding: 20px; }
        .detail-container { max-width: 1000px; margin: 40px auto; display: flex; flex-direction: column; gap: 30px; background: #111; border-radius: 15px; padding: 20px; border: 1px solid var(--gold); }
        @media (min-width: 768px) { .detail-container { flex-direction: row; padding: 40px; } }

        .detail-poster { width: 100%; max-width: 300px; border-radius: 10px; border: 2px solid var(--gold); align-self: center; }
        .detail-info { flex: 1; }
        .btn-play { background: var(--gold); color: #000; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin: 20px 0; transition: 0.2s; }
        .btn-play:hover { background: #fff; }

        .ep-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .ep-btn { padding: 8px 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; cursor: pointer; }
        .ep-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

        #player { display: none; margin-top: 20px; aspect-ratio: 16/9; width: 100%; border: 1px solid var(--gold); }
        .close-btn { float: right; color: red; font-weight: bold; cursor: pointer; border: 1px solid red; padding: 5px 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.reload()">GOLD CINEMA</div>
    <div class="search-bar"><input type="text" id="searchInp" placeholder="Tìm tên phim..."></div>
</div>

<div class="container">
    <h2 style="color:var(--gold); margin-bottom:20px;">Phim Mới Nhất</h2>
    <div id="movieGrid" class="grid"></div>
</div>

<div id="movie-detail">
    <div class="detail-container">
        <div style="width: 100%;"><span class="close-btn" onclick="closeDetail()">ĐÓNG X</span></div>
        <div id="detailContent" style="display: flex; flex-direction: inherit; gap: inherit; width: 100%;"></div>
    </div>
</div>

<script>
    let currentVideo = "";

    async function loadList(keyword = '') {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '<p>Đang tải dữ liệu...</p>';
        const url = keyword ? `/api/proxy?keyword=${encodeURIComponent(keyword)}` : `/api/proxy`;
        
        try {
            const res = await fetch(url).then(r => r.json());
            const items = res.data?.items || [];
            grid.innerHTML = items.map(m => `
                <div class="movie-card" onclick="showDetail('${m.slug}')">
                    <div class="poster-wrapper">
                        <img src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/FFD700?text=GOLD+CINEMA'">
                    </div>
                    <div class="movie-title">${m.name}</div>
                </div>
            `).join('');
        } catch(e) { grid.innerHTML = 'Lỗi kết nối API.'; }
    }

    window.showDetail = async function(slug) {
        const modal = document.getElementById('movie-detail');
        const content = document.getElementById('detailContent');
        modal.style.display = 'block';
        content.innerHTML = '<h3>Đang tải chi tiết...</h3>';

        try {
            const res = await fetch(`/api/proxy?path=${slug}`).then(r => r.json());
            const m = res.data.item;
            const eps = m.episodes[0]?.server_data || [];
            currentVideo = eps[0]?.link_embed || "";

            content.innerHTML = `
                <img class="detail-poster" src="${m.poster_url}" onerror="this.src='https://placehold.co/300x450/111/FFD700?text=NO+IMAGE'">
                <div class="detail-info">
                    <h1 style="color:var(--gold); margin-top:0">${m.name}</h1>
                    <p style="opacity:0.7">${m.year} • ${m.origin_name} • ${m.time}</p>
                    <div style="background:#000; padding:15px; border-radius:8px; font-size:14px; line-height:1.6">
                        ${m.content || 'Nội dung chưa cập nhật.'}
                    </div>
                    <button class="btn-play" onclick="watchNow()">XEM PHIM NGAY</button>
                    <h3>Tập phim:</h3>
                    <div class="ep-list">
                        ${eps.map((e, i) => `<button class="ep-btn ${i===0?'active':''}" onclick="changeEp('${e.link_embed}', this)">${e.name}</button>`).join('')}
                    </div>
                    <iframe id="player" allowfullscreen></iframe>
                </div>
            `;
        } catch(e) { content.innerHTML = 'Lỗi tải phim.'; }
    }

    window.watchNow = () => {
        const p = document.getElementById('player');
        p.style.display = 'block';
        p.src = currentVideo;
        p.scrollIntoView({ behavior: 'smooth' });
    };

    window.changeEp = (url, btn) => {
        currentVideo = url;
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(document.getElementById('player').style.display === 'block') watchNow();
    };

    window.closeDetail = () => {
        document.getElementById('movie-detail').style.display = 'none';
        document.getElementById('player').src = "";
    };

    document.getElementById('searchInp').onkeypress = (e) => { if(e.key === 'Enter') loadList(e.target.value); };
    window.onload = () => loadList();
</script>
</body>
</html>
