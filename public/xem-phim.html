<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đang tải... — KhoPhimChat</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="watch">

<div class="watch-topbar">
  <a href="index.html" class="watch-back" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="visually-hidden">Về trang chủ</span>
  </a>
  <div class="watch-title" id="watchTitle">Đang tải...</div>
  <div class="watch-src" id="watchSrc">—</div>
</div>

<div class="player-wrap">
  <div class="player-inner" id="playerInner">
    <div class="player-msg" id="playerMsg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Đang tải trình phát...
    </div>
  </div>
</div>

<div class="ep-bar" id="epBar" style="display:none">
  <div class="server-tabs" id="serverTabs"></div>
  <div class="ep-list" id="epList"></div>
</div>

<div class="movie-info" id="movieInfo">
  <div class="movie-poster sk" id="moviePoster"></div>
  <div>
    <h1 class="movie-title sk-title" id="mTitle" style="width:60%;height:24px;border-radius:6px">&nbsp;</h1>
    <p class="movie-orig" id="mOrig"></p>
    <div class="ticket movie-ticket" id="mTicket"></div>
    <div class="chip-row" id="mChips"></div>
    <p class="movie-desc clamp" id="mDesc"></p>
    <button class="desc-toggle" id="descToggle" style="display:none">Xem thêm</button>
    <div class="crew-row" id="mCrew"></div>
  </div>
</div>

<section class="section watch-related">
  <div class="section-hd">
    <div><div class="section-eyebrow">Gợi ý</div><div class="section-title">Có thể bạn cũng thích</div></div>
  </div>
  <div class="row-scroll" id="relatedRow">
    <div class="card sk-card"><div class="card-img sk"></div></div>
    <div class="card sk-card"><div class="card-img sk"></div></div>
    <div class="card sk-card"><div class="card-img sk"></div></div>
    <div class="card sk-card"><div class="card-img sk"></div></div>
    <div class="card sk-card"><div class="card-img sk"></div></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-row">
    <a href="index.html" class="logo" style="font-size:16px">
      <span class="mark" style="width:22px;height:22px"><svg viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5-9-5.5z" fill="currentColor"/></svg></span>
      <b>Kho</b><span>PhimChat</span>
    </a>
    <p class="footer-note">KhoPhimChat tổng hợp liên kết phim từ nhiều nguồn công khai, không lưu trữ file phim trên máy chủ.</p>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
var qp=new URLSearchParams(location.search);
var slug=qp.get('slug')||'', source=qp.get('source')||currentSource;
var active=null, curSi=0, curEi=0;

if(!slug){
  document.body.innerHTML='<div style="padding:80px 20px;text-align:center;color:var(--ink-faint)">Thiếu thông tin phim. <a href="index.html" style="color:var(--gold)">Về trang chủ</a></div>';
  throw new Error('missing slug');
}

qs('#watchSrc').textContent=SRC_NAMES[source]||source;

/* Hiện tạm dữ liệu đã cache từ trang trước (nếu có) để cảm giác nhanh hơn */
(function showQuick(){
  var q=getQuickCache(source,slug);
  if(!q) return;
  qs('#watchTitle').textContent=q.name;
  document.title=q.name+' — KhoPhimChat';
  qs('#mTitle').textContent=q.name;qs('#mTitle').classList.remove('sk-title');qs('#mTitle').style.cssText='';
  if(q.origin_name) qs('#mOrig').textContent=q.origin_name;
  var img=q.poster_url||q.thumb_url||'';
  if(img){
    qs('#moviePoster').classList.remove('sk');
    qs('#moviePoster').innerHTML='<img src="'+img+'" data-src="'+esc(img)+'" data-source="'+source+'" alt="" onerror="imgFallback(this)">';
  }
})();

/* ═══════════════════════════════════════
   PLAYER
═══════════════════════════════════════ */
function playerErrorHtml(msg){
  return '<div class="player-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'+(msg||'Không tìm được nguồn phát cho tập này.')+'</div>';
}

var hlsLoading=null;
function ensureHls(){
  if(window.Hls) return Promise.resolve();
  if(hlsLoading) return hlsLoading;
  hlsLoading=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
    s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
  });
  return hlsLoading;
}

function progressKey(){return 'kpc_progress:'+source+'|'+slug;}
function saveProgress(){
  try{localStorage.setItem(progressKey(),JSON.stringify({si:curSi,ei:curEi}));}catch(e){}
}

function playEpisode(si,ei){
  var sv=active.episodes[si]; if(!sv) return;
  var ep=sv.server_data[ei]; if(!ep) return;
  curSi=si;curEi=ei;
  saveProgress();
  updateActiveEls();
  var wrap=qs('#playerInner');
  if(ep.link_embed){
    wrap.innerHTML='<iframe src="'+esc(ep.link_embed)+'" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>';
  } else if(ep.link_m3u8){
    wrap.innerHTML='<video id="videoPlayer" controls autoplay playsinline></video>';
    var video=qs('#videoPlayer');
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=ep.link_m3u8;
    } else {
      ensureHls().then(function(){
        if(window.Hls && window.Hls.isSupported()){
          var hls=new window.Hls();
          hls.loadSource(ep.link_m3u8);
          hls.attachMedia(video);
        } else {
          wrap.innerHTML=playerErrorHtml();
        }
      }).catch(function(){wrap.innerHTML=playerErrorHtml('Không tải được trình phát video.');});
    }
  } else {
    wrap.innerHTML=playerErrorHtml();
  }
  document.querySelector('.player-wrap').scrollIntoView({behavior:'smooth',block:'start'});
}

function updateActiveEls(){
  qsa('.server-tab').forEach(function(t){t.classList.toggle('on',parseInt(t.dataset.si,10)===curSi);});
  qsa('.ep-btn').forEach(function(b){
    b.classList.toggle('on',parseInt(b.dataset.si,10)===curSi&&parseInt(b.dataset.ei,10)===curEi);
  });
  renderEpList();
}

function renderEpList(){
  var sv=active.episodes[curSi];
  if(!sv){qs('#epList').innerHTML='';return;}
  qs('#epList').innerHTML=sv.server_data.map(function(ep,ei){
    var on=(ei===curEi);
    return '<button class="ep-btn'+(on?' on':'')+'" data-si="'+curSi+'" data-ei="'+ei+'">'+esc(ep.name||('Tập '+(ei+1)))+'</button>';
  }).join('');
  qsa('.ep-btn',qs('#epList')).forEach(function(b){
    b.addEventListener('click',function(){playEpisode(parseInt(b.dataset.si,10),parseInt(b.dataset.ei,10));});
  });
}

function renderServerTabs(){
  qs('#serverTabs').innerHTML=active.episodes.map(function(sv,si){
    return '<button class="server-tab'+(si===curSi?' on':'')+'" data-si="'+si+'">'+esc(sv.server_name||('Server '+(si+1)))+'</button>';
  }).join('');
  qsa('.server-tab',qs('#serverTabs')).forEach(function(t){
    t.addEventListener('click',function(){
      var si=parseInt(t.dataset.si,10);
      var firstEi=0;
      playEpisode(si,firstEi);
    });
  });
}

/* ═══════════════════════════════════════
   THÔNG TIN PHIM
═══════════════════════════════════════ */
function renderInfo(){
  document.title=active.name+' — KhoPhimChat';
  qs('#watchTitle').textContent=active.name;
  var mTitle=qs('#mTitle');mTitle.textContent=active.name;mTitle.classList.remove('sk-title');mTitle.style.cssText='';
  qs('#mOrig').textContent=active.origin_name||'';

  var ticket='';
  if(active.quality) ticket+='<span class="tk gold">'+esc(active.quality)+'</span>';
  if(active.year) ticket+='<span class="tk">'+esc(active.year)+'</span>';
  if(active.episode_current) ticket+='<span class="tk teal">'+esc(active.episode_current)+'</span>';
  if(active.lang) ticket+='<span class="tk">'+esc(active.lang)+'</span>';
  ticket+='<span class="tk">'+(SRC_NAMES[source]||source)+'</span>';
  qs('#mTicket').innerHTML=ticket;

  var chips='';
  (active.category||[]).forEach(function(c){chips+='<span class="chip">'+esc(c.name)+'</span>';});
  (active.country||[]).forEach(function(c){chips+='<span class="chip">'+esc(c.name)+'</span>';});
  qs('#mChips').innerHTML=chips;

  var desc=(active.content||'').replace(/<[^>]*>/g,'').trim();
  var descEl=qs('#mDesc');
  descEl.textContent=desc||'Chưa có mô tả cho phim này.';
  var toggle=qs('#descToggle');
  if(desc.length>220){
    toggle.style.display='inline-block';
    toggle.onclick=function(){
      descEl.classList.toggle('clamp');
      toggle.textContent=descEl.classList.contains('clamp')?'Xem thêm':'Thu gọn';
    };
  }

  var crew='';
  if(active.director&&active.director.length) crew+='<div class="crew-block"><b>Đạo diễn</b><span>'+esc(active.director.join(', '))+'</span></div>';
  if(active.actor&&active.actor.length) crew+='<div class="crew-block"><b>Diễn viên</b><span>'+esc(active.actor.slice(0,10).join(', '))+'</span></div>';
  qs('#mCrew').innerHTML=crew;

  var poster=active.poster_url||active.thumb_url||'';
  var posterEl=qs('#moviePoster');
  posterEl.classList.remove('sk');
  posterEl.innerHTML=poster?'<img src="'+poster+'" data-src="'+esc(poster)+'" data-source="'+source+'" alt="" onerror="imgFallback(this)">':'';
}

/* ═══════════════════════════════════════
   PHIM LIÊN QUAN
═══════════════════════════════════════ */
function loadRelated(){
  var cat=(active.category&&active.category[0]&&active.category[0].slug)||(active.country&&active.country[0]&&active.country[0].slug);
  var params=cat?('cat='+cat):'';
  apiProxy(params+'&source='+encodeURIComponent(source)).then(function(res){
    var items=((res.data&&res.data.items)||[]).filter(function(m){return m.slug!==slug;}).slice(0,12);
    if(!items.length){qs('.watch-related').style.display='none';return;}
    qs('#relatedRow').innerHTML=items.map(function(m){return cardHtml(m,false);}).join('');
  }).catch(function(){qs('.watch-related').style.display='none';});
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
apiProxy('path='+encodeURIComponent(slug)+'&source='+encodeURIComponent(source)).then(function(r){
  active=r.data&&r.data.item;
  if(!active){
    qs('#watchTitle').textContent='Không tìm thấy phim';
    qs('#playerInner').innerHTML=playerErrorHtml('Không tìm thấy phim này ở nguồn '+(SRC_NAMES[source]||source)+'. Thử quay lại và đổi nguồn khác nhé.');
    qs('.watch-related').style.display='none';
    return;
  }
  active.source=active.source||source;
  renderInfo();

  if(!active.episodes||!active.episodes.length||!active.episodes.some(function(s){return s.server_data&&s.server_data.length;})){
    qs('#playerInner').innerHTML=playerErrorHtml('Phim này hiện chưa có tập phát trực tuyến.');
  } else {
    qs('#epBar').style.display='';
    renderServerTabs();
    var si=0,ei=0;
    try{
      var saved=JSON.parse(localStorage.getItem(progressKey())||'null');
      if(saved && active.episodes[saved.si] && active.episodes[saved.si].server_data[saved.ei]){si=saved.si;ei=saved.ei;}
    }catch(e){}
    playEpisode(si,ei);
  }

  loadRelated();
}).catch(function(){
  qs('#watchTitle').textContent='Lỗi tải dữ liệu';
  qs('#playerInner').innerHTML=playerErrorHtml('Có lỗi khi tải phim, thử lại sau nhé.');
  qs('.watch-related').style.display='none';
});
</script>
</body>
</html>
